<script>
'use strict';
/* =====================================================================
   ERP-Lite – Einzelplatz-ERP für Handel + Dienstleistung (Österreich)
   Daten: erp-daten.json im gewählten Ordner (File System Access API)
   ===================================================================== */
/* ===================== KONFIGURATION =====================
   Nach der App-Registrierung in Microsoft Entra eintragen
   (siehe ANLEITUNG-MOBIL.md). Diese Werte sind nicht geheim. */
const CONFIG={
  clientId:'',          // Anwendungs-ID (Client), z. B. '1a2b3c4d-....'
  tenantId:'',          // Verzeichnis-ID (Mandant)
  ordner:'ERP-Lite',    // Ordner im OneDrive für Daten, Sicherungen und Anhänge
};
/* ========================================================== */
const FILE='erp-daten.json';
const T={
  AN:{bez:'Angebot',b:'V',folge:['AB','AR','LS','RE','PR']},
  AB:{bez:'Auftragsbestätigung',b:'V',folge:['LS','AR','TR','RE','SR','PR','BE']},
  PR:{bez:'Proformarechnung',b:'V',folge:[]},
  LS:{bez:'Lieferschein',b:'V',folge:['RE','SR']},
  AR:{bez:'Anzahlungsrechnung',b:'V',re:1,folge:['GS']},
  TR:{bez:'Teilrechnung',b:'V',re:1,folge:['GS']},
  RE:{bez:'Rechnung',b:'V',re:1,folge:['GS']},
  SR:{bez:'Schlussrechnung',b:'V',re:1,folge:['GS']},
  GS:{bez:'Gutschrift',b:'V',re:1,folge:[]},
  BE:{bez:'Bestellung',b:'E',folge:['WE','ER']},
  WE:{bez:'Wareneingang',b:'E',folge:['ER']},
  ER:{bez:'Eingangsrechnung',b:'E',re:1,folge:[]},
};
const RE_V=['AR','TR','RE','SR','GS'];
const ART={W:'Ware',L:'Leistung',F:'Fremdleistung',G:'Gruppe',T:'Text'};
const showRab=b=>!!b.optRabatt||b.pos.some(p=>+p.rabatt);
// Positionsnummern: ohne Gruppen 1,2,3 – mit Gruppen 1, 1.01, 1.02, 2, 2.01 …
function posNummern(b){
  const m={},hatG=b.pos.some(p=>p.art==='G');let g=0,k=0,n=0;
  for(const p of b.pos){
    if(p.art==='T')continue;
    if(p.art==='G'){g++;k=0;m[p.id]=String(g);continue}
    if(hatG&&g){k++;m[p.id]=`${g}.${String(k).padStart(2,'0')}`}else{n++;m[p.id]=String(n)}
  }
  return m;
}
/* Formatierter Text: erlaubt sind fett, kursiv, unterstrichen, Listen, Zeilenumbrüche (+ <al> = Ausschreiberlücke aus ÖNORM-LB) */
const RT_OK={B:'b',STRONG:'b',I:'i',EM:'i',U:'u',UL:'ul',OL:'ol',LI:'li',DIV:'div',P:'div',AL:'al',SUP:'sup',SUB:'sub',TABLE:'table',TBODY:'tbody',TR:'tr',TD:'td'};
function clean(html){
  const d=new DOMParser().parseFromString('<div>'+String(html||'')+'</div>','text/html');
  const walk=n=>{let o='';for(const c of n.childNodes){
    if(c.nodeType===3){o+=esc(c.nodeValue);continue}
    if(c.nodeType!==1||/^(SCRIPT|STYLE|IFRAME|OBJECT|TEMPLATE)$/.test(c.tagName))continue;
    if(c.tagName==='BR'){o+='<br>';continue}
    let inner=walk(c);
    if(c.tagName==='SPAN'||c.tagName==='FONT'){const st=c.getAttribute('style')||'';if(/font-weight:\s*(bold|[6-9]00)/.test(st))inner=`<b>${inner}</b>`;if(/font-style:\s*italic/.test(st))inner=`<i>${inner}</i>`;if(/underline/.test(st))inner=`<u>${inner}</u>`}
    const t=RT_OK[c.tagName];o+=t?`<${t}>${inner}</${t}>`:inner;
  }return o};
  return walk(d.body.firstElementChild).replace(/^(\s|<br>)+|(\s|<br>)+$/g,'');
}

/* Zusammenführen, wenn auf einem anderen Gerät zwischenzeitlich gespeichert wurde (3-Wege-Abgleich je Datensatz) */
function merge3(base,local,remote){
  const eq=(a,b)=>JSON.stringify(a)===JSON.stringify(b),konfl=[],out=remote;
  for(const c of ['kontakte','artikel','belege','lager','zeiten','kalk','lv','lvbib']){
    out[c]=out[c]||[];
    const B=new Map((base?.[c]||[]).map(x=>[x.id,x])),R=new Map(out[c].map(x=>[x.id,x]));
    for(const l of local[c]||[]){
      const b=B.get(l.id),r=R.get(l.id);
      if(!b){if(!r)out[c].push(l);continue}
      if(eq(l,b))continue;
      if(!r){out[c].push(l);continue}
      if(eq(r,b))out[c][out[c].indexOf(r)]=l;
      else if(!eq(r,l))konfl.push(c==='belege'?`${T[l.typ]?.bez} ${bNr(l)}`:c==='kontakte'?l.name:c==='artikel'?l.nr:c);
    }
    const L=new Set((local[c]||[]).map(x=>x.id));
    for(const [id,b] of B)if(!L.has(id)&&R.has(id)&&eq(R.get(id),b))out[c].splice(out[c].indexOf(R.get(id)),1);
  }
  const seen=new Set((out.log||[]).map(x=>x.ts+x.aktion));
  out.log=[...(out.log||[]),...(local.log||[]).filter(x=>!seen.has(x.ts+x.aktion))].sort((a,b)=>a.ts.localeCompare(b.ts));
  if(!eq(local.settings,base?.settings)){if(eq(out.settings,base?.settings))out.settings=local.settings;else konfl.push('Einstellungen')}
  for(const t in local.settings.nk){const z=out.settings.nk[t]?.zaehler;if(!z)continue;for(const j in local.settings.nk[t].zaehler)z[j]=Math.max(z[j]||0,local.settings.nk[t].zaehler[j])}
  {const lf=local.fibu,bf=base?.fibu,rf=out.fibu;if(lf){if(!rf)out.fibu=lf;else{const ids=new Map(rf.buchungen.map(x=>[x.id,x]));for(const x of lf.buchungen){const r=ids.get(x.id);if(!r)rf.buchungen.push(x);else if(x.storno&&!r.storno){r.storno=true;r.stornoDatum=x.stornoDatum}}if(!eq(lf.map,bf?.map)&&eq(rf.map,bf?.map))rf.map=lf.map;if(!eq(lf.konten,bf?.konten)&&eq(rf.konten,bf?.konten))rf.konten=lf.konten;if((lf.sperre||'')>(rf.sperre||''))rf.sperre=lf.sperre}}}
  for(const k of ['K','L'])out.settings.knr[k]=Math.max(out.settings.knr[k]||0,local.settings.knr?.[k]||0);
  out.settings.anr=Math.max(out.settings.anr||0,local.settings.anr||0);
  return{db:out,konfl};
}
async function zusammenfuehren(){
  try{
    const base=STORE.lastText?JSON.parse(STORE.lastText):null,txt=await STORE.load();

  }catch(e){return f}
}

/* ---------- Rechenlogik ---------- */
const posGP=p=>isInfo(p)?0:r2((+p.menge||0)*(+p.ep||0)*(1-(+p.rabatt||0)/100));
const sgn=b=>b.typ==='GS'?-1:1;
function abzuegeLive(b){
  return DB.belege.filter(x=>x.auftragId&&x.auftragId===b.auftragId&&x.id!==b.id&&['AR','TR'].includes(x.typ)&&x.fest&&!x.storno)
    .map(x=>{const s=summen(x);return{id:x.id,nr:x.nr,typ:x.typ,datum:x.datum,netto:s.netto,brutto:s.brutto,steuern:s.steuern.map(t=>({code:t.code,basis:t.basis,betrag:t.betrag}))}});
}
/* Gruppen: eine Position der Art „G“ eröffnet eine Gruppe bis zur nächsten Gruppe.
   Gruppenpreis (pauschal) ersetzt die Summe der Gruppenpositionen; Kz der Gruppe gilt für alle Positionen. */
function gruppenInfo(b){
  const grp={},sumG={};let g=null;
  for(const p of b.pos){
    if(p.art==='G'){g=p;sumG[p.id]=0;continue}
    if(p.art==='T'||!g)continue;
    grp[p.id]=g;if(!p.kz)sumG[g.id]+=posGP(p);
  }
  for(const k in sumG)sumG[k]=r2(sumG[k]);
  return{grp,sumG};
}
const effKz=(p,gi)=>p.kz||gi.grp[p.id]?.kz||'';
const gruppePreis=(g,gi)=>+g.pauschal>0?r2(+g.pauschal):gi.sumG[g.id]||0;
function summen(b){
  const m={},gi=gruppenInfo(b);let netto=0,opt=0,lohn=0,sonst=0;
  for(const p of b.pos){
    if(p.art==='T')continue;
    if(p.art==='G'){if(+p.pauschal>0){const gp=r2(+p.pauschal);if(p.kz){opt+=gp;continue}netto+=gp;const c=p.steuer||S().stdSteuer;m[c]=(m[c]||0)+gp}continue}
    const g=gi.grp[p.id],gp=posGP(p);
    if(effKz(p,gi)){opt+=gp;continue}
    if(g&&+g.pauschal>0)continue;
    netto+=gp;m[p.steuer]=(m[p.steuer]||0)+gp;
    const f=(+p.menge||0)*(1-(+p.rabatt||0)/100);lohn+=f*(+p.epL||0);sonst+=f*(+p.epS||0);
  }
  const steuern=Object.keys(m).map(code=>{const d=steuerDef(code),basis=r2(m[code]);return{code,bez:d.bez,satz:+d.satz,basis,betrag:r2(basis*d.satz/100)}});
  netto=r2(netto);const steuer=sum(steuern,x=>x.betrag),brutto=r2(netto+steuer);
  const abz=b.typ==='SR'?(b.fest?(b.abzuege||[]):abzuegeLive(b)):[];
  const steuernEff=steuern.map(t=>{const a=abz.flatMap(x=>x.steuern).filter(x=>x.code===t.code);return{...t,basis:r2(t.basis-sum(a,x=>x.basis)),betrag:r2(t.betrag-sum(a,x=>x.betrag))}});
  const abzN=sum(abz,x=>x.netto),abzB=sum(abz,x=>x.brutto);
  return{netto,steuern,steuer,brutto,opt:r2(opt),abz,nettoEff:r2(netto-abzN),steuernEff,zahlbar:r2(brutto-abzB),lohn:r2(lohn),sonst:r2(sonst),gi};
}
const korrekturen=b=>DB.belege.filter(x=>x.typ==='GS'&&x.vorgaengerId===b.id&&x.fest&&!x.storno);
const bezahlt=b=>sum(b.zahlungen||[],z=>(+z.betrag||0)+(+z.skonto||0));
const faellig=b=>addDays(b.datum,b.zahlungsziel||0);
function offen(b){
  if(!T[b.typ].re||!b.fest)return 0;
  if(b.storno)return r2(-bezahlt(b)); // bereits bezahlte, stornierte Rechnung = Guthaben/Rückzahlung
  if(b.typ==='GS'){const v=beleg(b.vorgaengerId);if(v&&T[v.typ].re)return 0;return r2(-summen(b).brutto+bezahlt(b))}
  return r2(summen(b).zahlbar-sum(korrekturen(b),g=>summen(g).brutto)-bezahlt(b));
}
function zaehltUmsatz(b){return RE_V.includes(b.typ)&&b.fest&&!b.storno&&!(b.typ==='GS'&&b.stornoVon)}
function kinderMenge(posId,typen){let m=0;for(const b of DB.belege){if(b.storno||!typen.includes(b.typ))continue;for(const p of b.pos)if(p.herkunftPosId===posId)m+=(+p.menge||0)}return m}
function erledigung(b){
  const cat=b.typ==='BE'?['WE']:['LS'],cat2=b.typ==='BE'?['ER']:['RE','TR','SR'];
  let soll=0,ist=0;
  for(const p of b.pos){if(isInfo(p)||p.kz)continue;const m=+p.menge||0;soll+=m;ist+=Math.min(m,Math.max(kinderMenge(p.id,cat),kinderMenge(p.id,cat2)))}
  return soll?ist/soll:0;
}
function statusTag(b){
  if(b.storno)return Math.abs(offen(b))>0.005?tag('storniert – Guthaben '+fmt(-offen(b)),'err'):tag('storniert','err');
  if(!b.fest)return tag('Entwurf');
  if(b.typ==='AN'&&b.status==='ersetzt')return tag('ersetzt');
  if(b.typ==='AN')return b.status==='angenommen'?tag('angenommen','ok'):b.status==='abgelehnt'?tag('abgelehnt','err'):(b.gueltigBis&&b.gueltigBis<isoD()?tag('abgelaufen','warn'):tag('offen','acc'));
  if(b.typ==='GS'&&beleg(b.vorgaengerId)&&T[beleg(b.vorgaengerId).typ].re)return tag('verrechnet','ok');
  if(T[b.typ].re){const o=offen(b);if(Math.abs(o)<0.005)return tag('bezahlt','ok');return faellig(b)<isoD()?tag('überfällig','err'):tag('offen','acc')}

}
function vorkalk(b){
  const s=summen(b);let mat=0,eig=0;
  const gi=gruppenInfo(b);
  for(const p of b.pos){if(isInfo(p)||effKz(p,gi))continue;const k=(+p.menge||0)*(+p.ek||0);if(p.art==='L')eig+=k;else mat+=k}
  const mgk=r2(mat*S().mgz/100),hk=r2(mat+eig+mgk),u=s.netto,uS=r2(u*(1-(+b.skonto||0)/100)),z=S().zielDB2/100;
  return{u,uS,mat:r2(mat),eig:r2(eig),mgk,hk,db2:r2(uS-hk),db2p:uS?(uS-hk)/uS:NaN,aufschlag:hk?(uS-hk)/hk:NaN,fehl:Math.max(0,r2(hk/(1-z)-uS))};

function nachkalk(aid){
  const alle=DB.belege.filter(b=>b.auftragId===aid),ids=new Set(alle.map(b=>b.id));
  let umsatz=0,skonto=0;
  for(const b of alle.filter(zaehltUmsatz)){const s=summen(b);umsatz+=sgn(b)*s.nettoEff;const sk=sum(b.zahlungen||[],z=>z.skonto);if(sk&&s.brutto)skonto+=sk*s.netto/s.brutto}

  let fremd=0;

  const zt=DB.zeiten.filter(z=>z.auftragId===aid),eigen=sum(zt,z=>z.stunden*z.kosten),std=sum(zt,z=>z.stunden);

  return{umsatz:r2(umsatz),skonto:r2(skonto),uN,material:r2(material),fremd:r2(fremd),eigen,std,mgk,hk,db2:r2(uN-hk),db2p:uN?(uN-hk)/uN:NaN,aufschlag:hk?(uN-hk)/hk:NaN};
}
function dbTag(p){if(!isFinite(p))return tag('–');const z=S().zielDB2/100;return tag(pct(p),p>=z?'ok':p>=z-0.05?'warn':'err')}

/* ---------- Lager ---------- */
function bestand(artId,ohneId){let m=0,w=0;for(const e of DB.lager)if(e.artikelId===artId&&e.id!==ohneId){m+=e.menge;w+=e.wert}return{menge:r3(m),wert:r2(w)}}
function avgEK(artId){const b=bestand(artId);return b.menge>0?b.wert/b.menge:(+artikel(artId)?.ek||0)}
function lagerBuchung({artikelId,menge,preis=null,datum,belegId='',posId='',text=''}){
  const wert=menge>=0?menge*(preis??avgEK(artikelId)):menge*avgEK(artikelId);
  DB.lager.push({id:uid(),datum,artikelId,menge:r3(menge),wert:r2(wert),belegId,posId,text,ts:new Date().toISOString()});
}
function posIndex(){const m={};for(const b of DB.belege)for(const p of b.pos)m[p.id]={p,b};return m}
function bereitsGebucht(p,via,pm){
  let cur=pm[p.herkunftPosId]?.p,n=0;
  while(cur&&n++<20){
    const info=pm[cur.id];if(info.b.typ===via)return true;
    if(DB.belege.some(x=>x.typ===via&&!x.storno&&x.pos.some(q=>q.herkunftPosId===cur.id)))return true;
    cur=pm[cur.herkunftPosId]?.p;

function lagerBeiFest(b){

    dir=b.typ==='ER'?1:-1;

    lagerBuchung({artikelId:p.artikelId,menge:dir*basis,preis:dir>0&&basis?posGP(p)/basis:null,datum:b.datum,belegId:b.id,posId:p.id,text:`${T[b.typ].bez} ${b.nr}`});
  }

function neuPos(o={}){return{id:uid(),art:'W',artikelId:'',nr:'',bez:'',text:'',menge:1,einheit:'Stk',faktor:1,ep:0,rabatt:0,ek:0,steuer:S().stdSteuer,kz:'',herkunftPosId:'',...o}}
function folge(src,typ,extra={}){
  if(!src.fest){alert('Bitte den Beleg zuerst festschreiben.');return null}

  if(typ==='AR'){
    const p=prompt('Anzahlung in % der Summe netto:','30');if(p===null)return null;
    const f=num(p)/100,s=summen(src);if(!(f>0)){alert('Ungültiger Prozentsatz.');return null}
    const b=neuBeleg(typ,o);
    for(const t of s.steuern)b.pos.push(neuPos({art:'L',bez:`Anzahlung ${fmtQ(f*100)} % gemäß ${T[src.typ].bez} ${src.nr}`,menge:1,einheit:'PA',ep:r2(t.basis*f),steuer:t.code}));
    return b;
  }
  const b=neuBeleg(typ,o);
  const cat={LS:['LS'],WE:['WE'],RE:['RE','TR','SR'],TR:['RE','TR','SR'],ER:['ER']}[typ];
  for(const p of src.pos){

    let menge=+p.menge||0;
    if(!isInfo(p)&&cat){menge=r3(menge-kinderMenge(p.id,cat));if(menge<=0)continue}
    const np=neuPos({...p,id:uid(),herkunftPosId:p.id,menge});
    if(typ==='BE'){np.ep=+p.ek||0;np.rabatt=0;np.steuer=S().stdSteuer}
    b.pos.push(np);
  }
  if(!b.pos.some(p=>!isInfo(p))){DB.belege.pop();alert('Keine offenen Positionen für '+T[typ].bez+' vorhanden.');return null}
  if(src.typ==='AN'&&typ==='AB')src.status='angenommen';

function adressSnapshot(k){return k?{nr:k.nr,name:k.name,zusatz:k.zusatz,strasse:k.strasse,plz:k.plz,ort:k.ort,land:k.land,uid:k.uid}:{}}
async function festschreiben(b0){
  if(!await vorFest())return;
  const b=beleg(b0.id);if(!b||b.fest)return;
  const k=kontakt(b.kontaktId),s=summen(b),err=[],warn=[],t=T[b.typ];
  if(!k)err.push(t.b==='V'?'Kein Kunde gewählt.':'Kein Lieferant gewählt.');
  if(!b.pos.some(p=>!isInfo(p)))err.push('Keine Positionen.');
  if(b.pos.some(p=>!isInfo(p)&&!String(p.bez).trim()))err.push('Position ohne Bezeichnung.');
  if(t.b==='V'&&t.re){
    if(!S().firma.uid)warn.push('Eigene UID-Nr. fehlt (Einstellungen).');
    if(b.pos.some(p=>!isInfo(p)&&!p.kz&&['RC','IGL'].includes(p.steuer))&&!k?.uid)err.push('Reverse Charge / ig. Lieferung erfordert die UID-Nr. des Kunden.');
    if(s.brutto>10000&&!k?.uid)warn.push('Rechnung über 10.000 € brutto: UID-Nr. des Empfängers ist Pflichtangabe (wenn Unternehmer).');
    if(!String(b.leistung).trim()){if(confirm('Liefer-/Leistungsdatum fehlt (§ 11 UStG).\nRechnungsdatum übernehmen?'))b.leistung=dAT(b.datum);else err.push('Liefer-/Leistungsdatum fehlt.')}
    if(b.pos.some(p=>p.kz))warn.push('Rechnung enthält Options-/Alternativpositionen – diese werden NICHT verrechnet.');
  }
  if(b.typ==='ER'&&!String(b.fremdNr).trim())err.push('Rechnungsnummer des Lieferanten fehlt.');
  if(FB().sperre&&b.datum<=FB().sperre)err.push('Die Buchungsperiode bis '+dAT(FB().sperre)+' ist gesperrt (Finanzbuchhaltung → Einstellungen).');
  if(!OHNE_PREIS.includes(b.typ)&&b.pos.some(p=>!isInfo(p)&&!p.kz&&!(+p.ep)))warn.push('Position(en) mit Preis 0.');
  if(err.length){alert('Festschreiben nicht möglich:\n\n• '+err.join('\n• '));return}
  const fix=t.re||OHNE_PREIS.includes(b.typ),nrNeu=vorschlagNr(b);
  const ok=await dialog({
    titel:`${t.bez} festschreiben`,
    html:`<table class="mtab"><tr><td>${b.nr?'Nummer':'Folgende Nummer wird <b>endgültig</b> vergeben'}</td><td><b style="font-size:17px">${esc(nrNeu)}</b></td></tr>
      <tr><td>Datum</td><td>${dAT(b.datum)}</td></tr><tr><td>${t.b==='V'?'Kunde':'Lieferant'}</td><td>${esc(k.name)}</td></tr>
      ${OHNE_PREIS.includes(b.typ)?'':`<tr><td>Betrag brutto</td><td><b>${fmt(s.zahlbar)} €</b></td></tr>`}</table>
      ${warn.length?`<div class="hint"><b>Hinweise:</b><br>• ${warn.map(esc).join('<br>• ')}</div>`:''}
      ${fix?`<div class="mwarn">Nach dem Festschreiben kann dieser Beleg <b>nicht mehr geändert oder gelöscht</b> werden. Korrekturen sind nur noch über ${t.b==='V'&&t.re?'eine Gutschrift / Storno':'Storno'} möglich (§ 11 UStG, § 131 BAO).</div>`
        :`<div class="hint">Die Nummer bleibt fix. Der Inhalt kann später über „Bearbeiten“ noch geändert werden.</div>`}`,
    check:fix?'Ich habe den Beleg geprüft – Inhalt und Beträge sind korrekt.':'',
    ok:fix?'Endgültig festschreiben':'Festschreiben',gefahr:fix});
  if(!ok)return;
  if(!b.nr)b.nr=b.typ==='AN'&&b.rev?`${b.basisNr}-R${b.rev}`:nextNr(b.typ,b.datum);
  if(b.typ==='AN'&&b.basisNr)for(const x of DB.belege)if(x!==b&&x.typ==='AN'&&x.fest&&(x.nr===b.basisNr||x.basisNr===b.basisNr)&&(x.rev||0)<b.rev){x.status='ersetzt';log('Angebot ersetzt',`${x.nr} durch ${b.nr}`)}
  b.fest=true;b.festAm=new Date().toISOString();b.adresse=adressSnapshot(k);
  if(b.typ==='SR')b.abzuege=abzuegeLive(b);
  if(b.stornoVon){const o=beleg(b.stornoVon);if(o){o.storno=true;log('storniert',`${T[o.typ].bez} ${o.nr} durch ${b.nr}`)}}
  lagerBeiFest(b);
  log('festgeschrieben',`${t.bez} ${b.nr} · ${k.name} · ${fmt(s.brutto)}`);
  commit();render();
}
function stornieren(b){
  if(!b.fest){
    if(DB.belege.some(x=>x!==b&&(x.auftragId===b.id||x.vorgaengerId===b.id))){alert('Entwurf hat Folgebelege und kann nicht gelöscht werden.');return}
    if(!confirm('Entwurf endgültig löschen?'))return;
    DB.belege.splice(DB.belege.indexOf(b),1);
    for(const z of DB.zeiten)if(z.belegId===b.id)z.belegId='';
    log('Entwurf gelöscht',T[b.typ].bez);commit();go('belege/'+T[b.typ].b);return;
  }
  const t=T[b.typ];
  if(t.b==='V'&&t.re&&b.typ!=='GS'){
    if(!confirm('Es wird eine Storno-Gutschrift über den vollen Betrag als Entwurf angelegt.\nMit dem Festschreiben der Gutschrift gilt die Rechnung als storniert.\n\nFortfahren?'))return;
    const g=folge(b,'GS',{stornoVon:b.id});if(!g)return;
    g.pos=b.pos.map(p=>({...p,id:uid(),herkunftPosId:p.id}));
    g.kopf=`Storno zu ${t.bez} ${b.nr} vom ${dAT(b.datum)}.`;
    persist();go('beleg/'+g.id);return;
  }
  const msg=['LS','WE'].includes(b.typ)||DB.lager.some(e=>e.belegId===b.id)?'\nDie Lagerbuchungen werden gegengebucht.':'';
  if(!confirm(`${t.bez} ${b.nr} stornieren?${msg}`))return;
  for(const e of DB.lager.filter(e=>e.belegId===b.id))DB.lager.push({...e,id:uid(),datum:isoD(),menge:-e.menge,wert:-e.wert,text:'Storno '+b.nr,ts:new Date().toISOString()});
  if(b.typ==='GS'&&b.stornoVon){const o=beleg(b.stornoVon);if(o)o.storno=false}
  b.storno=true;log('storniert',`${t.bez} ${b.nr}`);commit();render();
}
function duplizieren(b){
  const n=neuBeleg(b.typ,{kontaktId:b.kontaktId,betreff:b.betreff,kopf:b.kopf,fuss:b.fuss,zahlungsziel:b.zahlungsziel,skonto:b.skonto,skontoTage:b.skontoTage,auftragId:T[b.typ].b==='E'?b.auftragId:''});
  n.pos=b.pos.map(p=>({...p,id:uid(),herkunftPosId:''}));persist();go('beleg/'+n.id);
}

/* ---------- Preisvorschläge ---------- */
function preisHistorie(b,p){
  const typen=T[b.typ].b==='V'?['AN','AB','PR','RE','TR','SR']:['BE','WE','ER'];
  const key=(p.bez||'').trim().toLowerCase();
  if(!p.artikelId&&!key)return[];
  const out=[];
  for(const x of DB.belege){
    if(x===b||x.storno||!typen.includes(x.typ))continue;
    for(const q of x.pos){
      if(isInfo(q))continue;
      if(p.artikelId?q.artikelId!==p.artikelId:(q.bez||'').trim().toLowerCase()!==key)continue;
      out.push({datum:x.datum,nr:bNr(x),typ:x.typ,kontaktId:x.kontaktId,menge:q.menge,einheit:q.einheit,ep:+q.ep,rabatt:+q.rabatt||0,ek:+q.ek||0,gleich:x.kontaktId===b.kontaktId});
    }
  }
  out.sort((a,c)=>(c.gleich-a.gleich)||c.datum.localeCompare(a.datum));
  return out.slice(0,15);
}
function artikelInPos(b,p,a){
  Object.assign(p,{artikelId:a.id,nr:a.nr,bez:a.bez,text:a.text||'',einheit:a.einheit,faktor:1,steuer:a.steuer||S().stdSteuer,art:a.art||'W'});
  const h=preisHistorie(b,p).filter(x=>x.einheit===p.einheit);
  if(T[b.typ].b==='V'){p.ek=+a.ek||0;p.ep=h.length?h[0].ep:(+a.vk||0);p.rabatt=h.length?h[0].rabatt:0}
  else{p.ep=h.length?h[0].ep:(+a.ek||0);p.ek=p.ep;const l=(a.lieferanten||[]).find(x=>x.kontaktId===b.kontaktId);if(l?.artNr)p.text=(p.text?p.text+'\n':'')+'Ihre Art.-Nr.: '+l.artNr}
}

function vorschlagNr(b){

/* ---------- Bearbeiten direkt in der Vorschau ---------- */
function deNum(s){s=String(s).replace(/[\s€%  ]/g,'');if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');const n=parseFloat(s);return isNaN(n)?0:n}
function edUebernehmen(el,next){
  const b=curBeleg();if(!b||b.fest)return;
  const[t,a,f]=el.dataset.ed.split(':'),rich=(t==='h'&&['kopf','fuss'].includes(a))||(t==='p'&&f==='text');
  const txt=rich?clean(el.innerHTML):el.innerText.replace(/\u00a0/g,' ').replace(/\n+$/,'');
  let val;
  if(t==='h'){if(b[a]===txt)return;b[a]=val=txt;const i=document.querySelector(`[data-h="${a}"]`);if(i)i.value=txt}
  else{
    const p=b.pos[+a];if(!p)return;
    const v=['menge','ep','rabatt','epL','epS'].includes(f)?deNum(txt):txt;
    if(p[f]===v)return;p[f]=val=v;
    if(f==='epL'||f==='epS'){p.ep=r2((+p.epL||0)+(+p.epS||0));const e=document.querySelector(`[data-p="${a}"][data-f="ep"]`);if(e)e.value=p.ep}
    const i=document.querySelector(`[data-p="${a}"][data-f="${f}"]`);if(i)i.value=v;
  }
  document.querySelectorAll(`[data-ed="${el.dataset.ed}"]`).forEach(o=>{if(o!==el)o.innerHTML=rich?rt(val):esc(val)});
  persist();
  const key=next?.dataset?.ed;
  updateCalc(b);
  if(key){const n=document.querySelector(`#vorschau [data-ed="${key}"]`);if(n){n.focus();const r=document.createRange();r.selectNodeContents(n);r.collapse(false);const s=getSelection();s.removeAllRanges();s.addRange(r)}}
}
document.addEventListener('focusout',e=>{const el=e.target.closest?.('[data-ed]');if(el)edUebernehmen(el,e.relatedTarget?.closest?.('[data-ed]'))});
document.addEventListener('keydown',e=>{const el=e.target.closest?.('[data-ed]');if(el&&e.key==='Enter'&&!el.classList.contains('ml')&&!el.classList.contains('rte')){e.preventDefault();el.blur()}});
document.addEventListener('paste',e=>{if(!e.target.closest?.('[data-ed]'))return;e.preventDefault();document.execCommand('insertText',false,(e.clipboardData||window.clipboardData).getData('text/plain'))});

/* ---------- Sicherheitsabfrage ---------- */
function dialog({titel,html,ok='OK',check='',gefahr=false}){
  return new Promise(res=>{
    const d=document.createElement('div');d.className='modal';
    d.innerHTML=`<div class="mbox"><h2>${titel}</h2>${html}${check?`<label class="chk"><input type="checkbox" id="m-chk"> ${check}</label>`:''}
      <div class="bar" style="justify-content:flex-end;margin:16px 0 0"><button id="m-no">Abbrechen</button><button class="p${gefahr?' gef':''}" id="m-ok" ${check?'disabled':''}>${ok}</button></div></div>`;
    document.body.appendChild(d);
    const fin=v=>{d.remove();document.removeEventListener('keydown',esc_);res(v)};
    const esc_=e=>{if(e.key==='Escape')fin(false)};document.addEventListener('keydown',esc_);
    d.querySelector('#m-no').onclick=()=>fin(false);d.querySelector('#m-ok').onclick=()=>fin(true);
    if(check)d.querySelector('#m-chk').onchange=e=>{d.querySelector('#m-ok').disabled=!e.target.checked};
  });
}

function angebotRevision(src){
  const basis=src.basisNr||src.nr;
  const rev=Math.max(0,...DB.belege.filter(x=>x.typ==='AN'&&(x.basisNr===basis||x.nr===basis)).map(x=>x.rev||0))+1;
  if(DB.belege.some(x=>x.typ==='AN'&&x.basisNr===basis&&!x.fest&&!x.storno)){alert('Es gibt bereits einen Revisions-Entwurf zu '+basis+'.');return}
  const b=neuBeleg('AN',{kontaktId:src.kontaktId,betreff:src.betreff,bezug:src.bezug,kopf:src.kopf,fuss:src.fuss,zahlungsziel:src.zahlungsziel,skonto:src.skonto,skontoTage:src.skontoTage,
    auftragId:src.auftragId,vorgaengerId:src.id,basisNr:basis,rev});
  b.pos=src.pos.map(p=>({...p,id:uid(),herkunftPosId:''}));
  log('Revision angelegt',`${basis}-R${rev}`);persist();go('beleg/'+b.id);
}
function folgeAngebot(src){
  const mitPos=confirm(`Positionen aus ${src.nr} übernehmen?\n\nOK = übernehmen · Abbrechen = leeres Folgeangebot`);
  const b=neuBeleg('AN',{kontaktId:src.kontaktId,betreff:src.betreff,bezug:`Folgeangebot zu Angebot ${src.nr} vom ${dAT(src.datum)}`,zahlungsziel:src.zahlungsziel,skonto:src.skonto,skontoTage:src.skontoTage,auftragId:src.auftragId,vorgaengerId:src.id});
  if(mitPos)b.pos=src.pos.map(p=>({...p,id:uid(),herkunftPosId:''}));
  log('Folgeangebot angelegt',`zu ${src.nr}`);persist();go('beleg/'+b.id);
}

/* ---------- Aufträge ---------- */
function auftragsListe(){
  const g={};for(const b of DB.belege)if(b.auftragId&&T[b.typ].b==='V')(g[b.auftragId]=g[b.auftragId]||[]).push(b);
  return Object.entries(g).map(([id,docs])=>({id,docs,root:beleg(id)||docs[0]})).sort((a,c)=>c.root.datum.localeCompare(a.root.datum));
}
function auftragLabel(aid){const r=beleg(aid)||DB.belege.find(b=>b.auftragId===aid);return r?`${bNr(r)} · ${kName(r.kontaktId)}${r.betreff?' · '+r.betreff:''}`:'–'}
function phase(docs){
  const ok=docs.filter(d=>!d.storno);
  if(ok.some(d=>d.typ==='SR'&&d.fest))return tag('schlussgerechnet','ok');
  if(ok.some(d=>['RE','TR','AR'].includes(d.typ)&&d.fest))return tag('in Abrechnung','acc');
  if(ok.some(d=>d.typ==='AB'))return tag('Auftrag','acc');
  const an=ok.find(d=>d.typ==='AN');
  if(an)return an.status==='abgelehnt'?tag('Angebot abgelehnt','err'):tag('Angebot','warn');
  return tag('–');
}
V.auftraege=()=>{
  const L=auftragsListe().filter(a=>!a.docs.every(d=>d.storno));
  return`<h1>Aufträge &amp; Kalkulation DB II</h1>
  <p class="mut">Ein Auftrag umfasst alle Belege einer Belegkette (Angebot → … → Rechnung) sowie zugeordnete Eingangsrechnungen und Stunden. Ziel-DB II: ${fmtQ(S().zielDB2)} % vom Umsatz nach Skonto.</p>
  <div class="card" style="padding:0"><table><thead><tr><th>Auftrag</th><th>Kunde</th><th>Betreff</th><th>Phase</th><th class="n">Vorkalk. Umsatz</th><th class="n">Vorkalk. DB II</th><th class="n">Ist-Umsatz</th><th class="n">Ist-HK</th><th class="n">Ist-DB II</th></tr></thead><tbody>
  ${L.map(a=>{const vb=a.docs.filter(d=>['AB','AN'].includes(d.typ)&&!d.storno&&d.status!=='ersetzt').sort((x,y)=>(x.typ==='AB'?-1:1)-(y.typ==='AB'?-1:1))[0];const v=vb?vorkalk(vb):null,n=nachkalk(a.id);
  return`<tr class="click" onclick="nav('auftrag/${a.id}')"><td>${esc(bNr(a.root))}</td><td>${esc(kName(a.root.kontaktId))}</td><td>${esc(a.root.betreff)}</td><td>${phase(a.docs)}</td><td class="n">${v?fmt(v.uS):''}</td><td class="n">${v?dbTag(v.db2p):''}</td><td class="n">${n.uN?fmt(n.uN):''}</td><td class="n">${n.hk?fmt(n.hk):''}</td><td class="n">${n.uN?fmt(n.db2)+' '+dbTag(n.db2p):''}</td></tr>`}).join('')||'<tr><td colspan="9" class="mut">Noch keine Aufträge.</td></tr>'}
  </tbody></table></div>`;
};
V.auftrag=aid=>{
  const docs=DB.belege.filter(b=>b.auftragId===aid).sort((a,c)=>a.erstellt.localeCompare(c.erstellt));
  if(!docs.length)return'<p>Auftrag nicht gefunden.</p>';
  const root=beleg(aid)||docs[0],n=nachkalk(aid);
  const vb=docs.filter(d=>['AB','AN'].includes(d.typ)&&!d.storno&&d.status!=='ersetzt').sort((x,y)=>(x.typ==='AB'?-1:1)-(y.typ==='AB'?-1:1))[0],v=vb?vorkalk(vb):null;
  const zt=DB.zeiten.filter(z=>z.auftragId===aid).sort((a,c)=>a.datum.localeCompare(c.datum));
  const offenZ=zt.filter(z=>!z.belegId);
  const row=(l,a,b)=>`<tr><td>${l}</td><td class="n">${a}</td><td class="n">${b}</td></tr>`;
  return`<div class="bar"><h1 style="margin:0">Auftrag ${esc(bNr(root))}</h1>${phase(docs)}<span class="sp"></span>
    <button data-act="abe" data-id="${aid}">+ Bestellung</button><button data-act="aer" data-id="${aid}">+ Eingangsrechnung</button>
    ${offenZ.length?`<button class="p" data-act="zabr" data-id="${aid}">${offenZ.length} Zeiten abrechnen</button>`:''}</div>
  <p>${esc(kName(root.kontaktId))} · ${esc(root.betreff)}</p>
  <div class="cols"><div>
  <div class="card"><h2>Belege</h2><table><thead><tr><th>Datum</th><th>Beleg</th><th>Partner</th><th class="n">Netto</th><th>Status</th></tr></thead><tbody>
  ${docs.map(b=>`<tr class="click" onclick="nav('beleg/${b.id}')"><td>${dAT(b.datum)}</td><td>${T[b.typ].bez} ${esc(bNr(b))}</td><td>${esc(kName(b.kontaktId))}</td><td class="n">${fmt(sgn(b)*summen(b).nettoEff)}</td><td>${statusTag(b)}</td></tr>`).join('')}
  </tbody></table></div>
  <div class="card"><h2>Stunden</h2><table><thead><tr><th>Datum</th><th>Tarif</th><th>Tätigkeit</th><th class="n">Std.</th><th class="n">Kosten</th><th>abgerechnet</th></tr></thead><tbody>
  ${zt.map(z=>`<tr><td>${dAT(z.datum)}</td><td>${esc(z.tarif)}</td><td>${esc(z.text)}</td><td class="n">${fmtQ(z.stunden)}</td><td class="n">${fmt(z.stunden*z.kosten)}</td><td>${z.belegId?`<a href="#/beleg/${z.belegId}">${esc(bNr(beleg(z.belegId)))}</a>`:tag('offen','warn')}</td></tr>`).join('')||'<tr><td colspan="6" class="mut">keine – Erfassung unter <a href="#/zeiten">Zeiterfassung</a></td></tr>'}
  </tbody></table></div>
  </div><div>
  <div class="card"><h2>Vor- / Nachkalkulation</h2><table><thead><tr><th></th><th class="n">Vorkalk.</th><th class="n">Ist</th></tr></thead><tbody>
  ${row('Umsatz nach Skonto',v?fmt(v.uS):'–',fmt(n.uN))}
  ${row('Material / Ware',v?fmt(v.mat):'–',fmt(n.material+n.fremd))}
  ${row('Eigenleistung',v?fmt(v.eig):'–',fmt(n.eigen)+` <span class="mut">(${fmtQ(n.std)} h)</span>`)}
  ${S().mgz?row('MGZ',v?fmt(v.mgk):'–',fmt(n.mgk)):''}
  ${row('<b>Herstellkosten</b>',v?fmt(v.hk):'–',fmt(n.hk))}
  ${row('<b>DB II</b>',v?fmt(v.db2):'–',fmt(n.db2))}
  ${row('DB II % vom Umsatz',v?dbTag(v.db2p):'–',dbTag(n.db2p))}
  ${row('Aufschlag auf HK',v?pct(v.aufschlag):'–',pct(n.aufschlag))}
  </tbody></table>
  <p class="mut" style="font-size:12px;margin:8px 0 0">Ist: Rechnungen netto (abzgl. Gutschriften, gezogenes Skonto) − Lagerabgänge zu Ø-EK − Eingangsrechnungen dieses Auftrags − Stunden × Kostensatz.</p></div>
  </div></div>`;
};
function zeitenAbrechnen(aid){
  const zt=DB.zeiten.filter(z=>z.auftragId===aid&&!z.belegId);if(!zt.length)return;
  const root=beleg(aid)||DB.belege.find(b=>b.auftragId===aid);
  const b=neuBeleg('RE',{kontaktId:root.kontaktId,auftragId:aid,betreff:root.betreff,vorgaengerId:'',zahlungsziel:kontakt(root.kontaktId)?.zahlungsziel??S().zahlungsziel});
  zeitenInPos(b,zt);
  const ds=zt.map(z=>z.datum).sort();b.leistung=ds[0]===ds[ds.length-1]?dAT(ds[0]):`${dAT(ds[0])} – ${dAT(ds[ds.length-1])}`;
  persist();go('beleg/'+b.id);
}
function zeitenInPos(b,zt){
  for(const z of zt.sort((a,c)=>a.datum.localeCompare(c.datum))){
    const tf=S().tarife.find(t=>t.kz===z.tarif);
    b.pos.push(neuPos({art:'L',nr:z.tarif,bez:tf?.bez||z.tarif,text:`${dAT(z.datum)}${z.text?' – '+z.text:''}`,menge:z.stunden,einheit:'h',ep:z.vk,ek:z.kosten}));
    z.belegId=b.id;
  }
}

  ${L.map(k=>{const op=sum(DB.belege.filter(b=>b.kontaktId===k.id),b=>T[b.typ].b==='V'?offen(b):-offen(b));return`<tr class="click" onclick="nav('kontakt/${k.id}')"><td>${esc(k.nr)}</td><td>${esc(k.name)}</td><td>${{K:'Kunde',L:'Lieferant',KL:'Kunde + Lieferant'}[k.typ]}</td><td>${esc(k.plz)} ${esc(k.ort)}</td><td>${esc(k.uid)}</td><td class="n">${op?fmt(op):''}</td></tr>`}).join('')||'<tr><td colspan="6" class="mut">Keine Kontakte.</td></tr>'}

  const q=UI.aQ.toLowerCase();
  const L=DB.artikel.filter(a=>!q||[a.nr,a.bez].join(' ').toLowerCase().includes(q)).sort((a,c)=>String(a.nr).localeCompare(String(c.nr)));
  return`<h1>Artikel &amp; Leistungen</h1><div class="bar"><input data-o="ui" data-f="aQ" placeholder="Suche" value="${esc(UI.aQ)}" style="width:260px"><span class="sp"></span><button class="p" data-act="anew">+ Artikel</button></div>
  <div class="card" style="padding:0"><table><thead><tr><th>Nr</th><th>Bezeichnung</th><th>Art</th><th>Einh.</th><th class="n">EK</th><th class="n">VK</th><th>Lager</th><th class="n">Bestand</th></tr></thead><tbody>
  ${L.map(a=>`<tr class="click" onclick="nav('artikel/${a.id}')" style="${a.aktiv===false?'opacity:.5':''}"><td>${esc(a.nr)}</td><td>${esc(a.bez)}</td><td>${ART[a.art]}</td><td>${esc(a.einheit)}</td><td class="n">${fmt(a.ek)}</td><td class="n">${fmt(a.vk)}</td><td>${a.lager?'✓':''}</td><td class="n">${a.lager?fmtQ(bestand(a.id).menge):''}</td></tr>`).join('')||'<tr><td colspan="8" class="mut">Keine Artikel. Positionen können auch frei erfasst und mit „+A“ als Artikel gespeichert werden.</td></tr>'}

  const bs=bestand(a.id);
  return`<div class="bar"><h1 style="margin:0">${esc(a.nr)} ${esc(a.bez)}</h1><span class="sp"></span><button class="d" data-act="adel" data-id="${a.id}">Löschen</button></div>

    <label>Weitere Einheiten (z. B. Krt=10; Rolle=100)<input data-o="a" data-id="${a.id}" data-f="einheitenStr" value="${esc((a.einheiten||[]).map(x=>x.e+'='+x.f).join('; '))}"></label>
    ${f('ek','EK je Basiseinheit','w05','number')}${f('vk','VK je Basiseinheit','w05','number')}
    <label class="w05">USt<select data-o="a" data-id="${a.id}" data-f="steuer">${S().steuer.map(s=>opt(s.code,s.bez,a.steuer)).join('')}</select></label></div>

  </tbody></table></div>`;
};

/* ---------- Auswertungen ---------- */
function ustVerteilung(b){
  // Liefert [{datum,faktor}] – Soll: Rechnungsdatum; Ist und Anzahlungen: Zahlungsdatum
  const ist=S().besteuerung==='ist'||b.typ==='AR';
  if(!ist||b.typ==='ER')return[{datum:b.datum,f:1}];

function k3calc(kb,c){

function teileCalc(kb,teile,tiefe=0){
  let std=0,sk=0;
  for(const t of teile||[]){
    const m=+t.menge||0;
    if(t.typ==='L'){std+=m;continue}
    if(t.typ==='K5'){const k5=kb?.k5.find(x=>x.id===t.ref);if(k5&&tiefe<4){const r=teileCalc(kb,k5.teile,tiefe+1);std+=m*r.std;sk+=m*r.sk}continue}

    if(t.typ==='G'&&t.ref){const x=kb?.k6.find(y=>y.id===t.ref);if(x)k=k6kosten(x)}

  }

}

      <tr class="ks"><td>Lohnkosten je Stunde</td><td></td><td class="n">${fmt(x.lk)}</td><td></td></tr>

      <tr class="kt"><td>${esc(c.name)} (berechnet)</td><td></td><td class="n">${fmt(x.mlpR)} €/h</td><td></td></tr>
      ${+c.mlpAngabe>0?`<tr class="kt"><td>angegeben vom Bieter · Abweichung</td><td></td><td class="n">${fmt(c.mlpAngabe)} €/h · ${pct(x.mlpR?(c.mlpAngabe-x.mlpR)/x.mlpR:NaN)}</td><td></td></tr>`:''}
      <tr><td class="mut">Faktor Preis / KV-Lohn</td><td></td><td class="n mut">${isFinite(x.faktor)?fmtQ(x.faktor):'–'}</td><td></td></tr>
      </tbody></table></div>`}).join('')+`<button data-act="arradd" data-r="${R}" data-f="k3" data-tpl="k3">+ weiteres K3-Blatt (z. B. Regielohnpreis, Gehaltspreis)</button>`;
  }
  if(tab==='K4'){
    body=`<table class="k"><thead><tr><th>Material</th><th>Einh.</th><th class="n">Listenpreis</th><th class="n">Rabatt %</th><th class="n">Bezugskosten %</th><th class="n">Verlust/Verschnitt %</th><th class="n">Kosten</th><th class="n">Preis (+${fmt(g.s)} %)</th><th></th></tr></thead><tbody>
    ${kb.k4.map((m,i)=>{const P=`k4.${i}`,k=k4kosten(m);return`<tr><td>${fi(R,P+'.bez',m.bez)}</td><td>${fsel(R,P+'.einheit',m.einheit,S().einheiten.map(e=>[e,e]),'80px')}</td><td>${fi(R,P+'.lp',m.lp,{n:1,w:'95px'})}</td><td>${fi(R,P+'.rab',m.rab,{n:1,w:'75px'})}</td><td>${fi(R,P+'.bezug',m.bezug,{n:1,w:'75px'})}</td><td>${fi(R,P+'.verlust',m.verlust,{n:1,w:'75px'})}</td><td class="n">${fmt(k)}</td><td class="n">${fmt(k*(1+g.s/100))}</td><td>${del('k4',i)}</td></tr>`}).join('')}
    </tbody></table>${arrBtn('k4','k4','+ Material')} <button class="s" data-act="k4art" data-r="${R}">Artikel übernehmen …</button>`;
  }
  if(tab==='K6'){
    body=`<table class="k"><thead><tr><th>Gerät</th><th>Einh.</th><th class="n">Abschreibung + Verzinsung</th><th class="n">Reparatur</th><th class="n">Betriebskosten</th><th class="n">Kosten</th><th class="n">Preis (+${fmt(g.s)} %)</th><th></th></tr></thead><tbody>
    ${kb.k6.map((m,i)=>{const P=`k6.${i}`,k=k6kosten(m);return`<tr><td>${fi(R,P+'.bez',m.bez)}</td><td>${fsel(R,P+'.einheit',m.einheit,['h','Tag','Woche','Monat','Stk','PA'].map(e=>[e,e]),'80px')}</td><td>${fi(R,P+'.av',m.av,{n:1,w:'110px'})}</td><td>${fi(R,P+'.rep',m.rep,{n:1,w:'95px'})}</td><td>${fi(R,P+'.betrieb',m.betrieb,{n:1,w:'95px'})}</td><td class="n">${fmt(k)}</td><td class="n">${fmt(k*(1+g.s/100))}</td><td>${del('k6',i)}</td></tr>`}).join('')}
    </tbody></table>${arrBtn('k6','k6','+ Gerät')}`;
  }
  if(tab==='K5'){
    body=kb.k5.map((c,ci)=>{const P=`k5.${ci}`,r=teileCalc(kb,c.teile),k3=k3von(kb),x=k3?k3calc(kb,k3):{mlp:0};
      return`<div class="card"><div class="row"><label class="w2">Komponente${fi(R,P+'.bez',c.bez)}</label><label class="w05">Einheit${fsel(R,P+'.einheit',c.einheit,S().einheiten.map(e=>[e,e]))}</label><button class="s d" data-act="arrdel" data-r="${R}" data-f="k5" data-i="${ci}">Löschen</button></div>
      ${teileTab(kb,R,P+'.teile',c.teile,true)}
      <p style="margin:6px 0 0"><b>Je ${esc(c.einheit)}:</b> ${fmtQ(r.std)} h Lohn (${fmt(r.std*x.mlp)} €) · Sonstiges Kosten ${fmt(r.sk)} € → Preis ${fmt(r.sk*(1+g.s/100))} €</p></div>`}).join('')+arrBtn('k5','k5','+ Komponente');
  }
  if(tab==='VGL'){
    const andere=DB.kalk.filter(x=>x.id!==kb.id),ref=DB.kalk.find(x=>x.id===UI.kbVgl)||andere[0];
    if(!ref)body='<p class="mut">Für einen Vergleich wird eine zweite Kalkulationsbasis benötigt (z. B. eigene Werte oder anderer Bieter).</p>';
    else{
      const a=kb.k3[0]?k3calc(kb,kb.k3[0]):null,b=ref.k3[0]?k3calc(ref,ref.k3[0]):null,ga=k2gz(kb),gb=k2gz(ref),gr=S().abwGrenze/100;
      const z=(l,va,vb,f=fmt)=>{const d=vb?(va-vb)/vb:NaN,flag=isFinite(d)&&Math.abs(d)>gr;return`<tr><td>${l}</td><td class="n">${f(va)}</td><td class="n">${f(vb)}</td><td class="n ${flag?'err':''}">${isFinite(d)?pct(d):'–'}${flag?' ⚠':''}</td></tr>`};
      body=`<div class="bar">Vergleich mit <select data-o="ui" data-f="kbVgl">${andere.map(x=>opt(x.id,x.name,ref.id)).join('')}</select><span class="mut">Markierung bei Abweichung über ${fmtQ(S().abwGrenze)} % (Einstellungen)</span></div>
      <table class="k"><thead><tr><th>Kennwert</th><th class="n">${esc(kb.name)}</th><th class="n">${esc(ref.name)}</th><th class="n">Abweichung</th></tr></thead><tbody>
      ${z('Gesamtzuschlag Lohn %',ga.l,gb.l)}${z('Gesamtzuschlag Sonstiges %',ga.s,gb.s)}
      ${kb.k2.zeilen.map(r=>{const o=ref.k2.zeilen.find(x=>x.bez===r.bez);return o?z(' · '+esc(r.bez)+' (Lohn)',+r.l,+o.l)+z(' · '+esc(r.bez)+' (Sonst.)',+r.s,+o.s):''}).join('')}
      ${a&&b?z('Gewichteter KV-Lohn €/h',a.kv,b.kv)+z('Mittellohn €/h',a.ml,b.ml)+z('Lohnnebenkosten %',a.lnkP,b.lnkP)+z('Mittellohnkosten €/h',a.mlk,b.mlk)+z('Personalgemeinkosten %',a.pgkP,b.pgkP)+z('Mittellohnpreis €/h',a.mlp,b.mlp)+z('Faktor Preis / KV-Lohn',a.faktor,b.faktor,v=>isFinite(v)?fmtQ(v):'–'):''}
      </tbody></table>`;
    }
  }
  const tabs=[['K2','K2 Gesamtzuschlag'],['K3','K3 Personalpreis'],['K4','K4 Material'],['K5','K5 Komponenten'],['K6','K6 Geräte'],['VGL','Vergleich / Prüfung']];
  return`<div class="bar"><h1 style="margin:0">${esc(kb.name)}</h1>${kb.art==='bieter'?tag('Prüfung Bieter','warn'):''}<span class="sp"></span>
    <button data-act="kbdruck" data-id="${kb.id}">PDF / Drucken</button><button data-act="kbdup" data-id="${kb.id}">Kopie (neues Jahr)</button><button class="d" data-act="kbdel" data-id="${kb.id}">Löschen</button></div>
  <div class="card"><div class="row"><label class="w2">Bezeichnung${fi(R,'name',kb.name)}</label>${kb.art==='bieter'?`<label>Bieter${fi(R,'bieter',kb.bieter)}</label>`:''}<label>Projekt / Gültigkeit${fi(R,'projekt',kb.projekt)}</label></div>
  <div class="row"><label>Notiz / Prüfvermerk${ft(R,'notiz',kb.notiz)}</label></div></div>
  <div class="bar"><span class="seg">${tabs.map(([k,l])=>`<button class="${tab===k?'on':''}" data-act="kbtab" data-t="${k}">${l}</button>`).join('')}</span></div>
  <div class="card" style="overflow-x:auto">${body}</div>
  <p class="mut" style="font-size:12px">Aufbau nach dem Grundschema der ÖNORM B 2061. Zeilen und Bezeichnungen bitte mit der gültigen Normfassung und dem aktuellen Kollektivvertrag abgleichen.</p>`;
}
function teileTab(kb,R,f,teile,mitK5){
  const k4=kb?.k4||[],k6=kb?.k6||[],k5=kb?.k5||[],gzS=k2gz(kb).s;
  const typen=[['L','Lohn (h)'],['M','Material (K4)'],['G','Gerät (K6)'],['F','Fremdleistung'],...(mitK5?[]:[['K5','Komponente (K5)']])];
  return`<table class="k"><thead><tr><th>Art</th><th>Bezug / Bezeichnung</th><th class="n">Menge</th><th class="n">Kosten/Einh.</th><th class="n">Kosten</th><th></th></tr></thead><tbody>
  ${(teile||[]).map((t,i)=>{const P=`${f}.${i}`;let refSel='',k=+t.kosten||0,eig=true;
    if(t.typ==='M'){refSel=fsel(R,P+'.ref',t.ref,[['','– frei –'],...k4.map(x=>[x.id,x.bez])]);const x=k4.find(y=>y.id===t.ref);if(x){k=k4kosten(x);eig=false}}
    if(t.typ==='G'){refSel=fsel(R,P+'.ref',t.ref,[['','– frei –'],...k6.map(x=>[x.id,x.bez])]);const x=k6.find(y=>y.id===t.ref);if(x){k=k6kosten(x);eig=false}}
    if(t.typ==='K5'){refSel=fsel(R,P+'.ref',t.ref,[['','– wählen –'],...k5.map(x=>[x.id,x.bez])]);eig=false}
    const r=t.typ==='L'||t.typ==='K5'?null:k*(+t.menge||0);
    return`<tr><td>${fsel(R,P+'.typ',t.typ,typen,'140px')}</td><td>${refSel}${eig||t.typ==='L'?fi(R,P+'.bez',t.bez,{ph:'Bezeichnung'}):''}</td><td>${fi(R,P+'.menge',t.menge,{n:1,w:'85px'})}</td>
      <td class="n">${t.typ==='L'?'<span class="mut">h</span>':t.typ==='K5'?'':eig?fi(R,P+'.kosten',t.kosten,{n:1,w:'95px'}):fmt(k)}</td><td class="n">${r==null?'':fmt(r)}</td><td><button class="s d" data-act="arrdel" data-r="${R}" data-f="${f}" data-i="${i}">✕</button></td></tr>`}).join('')}
  </tbody></table><button class="s" data-act="arradd" data-r="${R}" data-f="${f}" data-tpl="teil">+ Zeile</button>`;
}

      const P=`items.${i}`,act=`<span class="lvact"><button class="s" data-act="lvmv" data-id="${lv.id}" data-i="${i}" data-d="-1">↑</button><button class="s" data-act="lvmv" data-id="${lv.id}" data-i="${i}" data-d="1">↓</button>${it.typ==='POS'?`<button class="s" data-act="lvbib" data-id="${lv.id}" data-i="${i}" title="als Textbaustein speichern">→ Baustein</button>`:''}<button class="s d" data-act="lvdel" data-id="${lv.id}" data-i="${i}">✕</button></span>`;

        ${aus&&!lv.schaetzung?'':`<label class="w05">EP Lohn${it.modus==='k7'?`<input disabled value="${fmt(pr.l)}">`:fi(R,P+'.epL',it.epL,{n:1})}</label><label class="w05">EP Sonst.${it.modus==='k7'?`<input disabled value="${fmt(pr.s)}">`:fi(R,P+'.epS',it.epS,{n:1})}</label>

        ${act}</div>

        ${aus&&!lv.schaetzung?'':`<div class="k7bar"><button class="s ${offen?'p':''}" data-act="lvk7" data-p="${it.id}">K7 ${it.modus==='k7'?`✓ ${fmtQ(pr.k7?.std||0)} h`:'(manuell)'}</button>${pr.kosten?`<span class="mut">Kosten ${fmt(pr.kosten)} · DB ${pct(pr.ep?(pr.ep-pr.kosten)/pr.ep:NaN)}</span>`:''}</div>
        ${offen?k7Editor(lv,it,P):''}`}
      </div>`;
    }).join('')+`<div class="bar" style="margin-top:10px"><button data-act="lvadd" data-id="${lv.id}" data-t="LG">+ Leistungsgruppe</button><button data-act="lvadd" data-id="${lv.id}" data-t="ULG">+ Unterleistungsgruppe</button><button class="p" data-act="lvadd" data-id="${lv.id}" data-t="POS">+ Position</button>

  }

  <div class="bar"><span class="seg">${tabs.map(([k,l])=>`<button class="${tab===k?'on':''}" data-act="lvtab" data-t="${k}">${l}</button>`).join('')}</span></div>
  ${body}`;

/* =====================================================================
   STANDARDISIERTE LEISTUNGSBESCHREIBUNG (LB-HT u. a.) – Import ONLB (ÖNORM A 2063)
   Kataloge liegen je Gerät im Browser-Speicher (IndexedDB), nicht in erp-daten.json.
   ===================================================================== */
let LBC={};            // geladene Kataloge (Schlüssel z. B. "HT14")
let LBLISTE=null;      // Übersicht der importierten Kataloge
function x2h(n){
  let o='';
  for(const c of n.childNodes){
    if(c.nodeType===3){o+=esc(c.nodeValue);continue}
    if(c.nodeType!==1)continue;
    const ln=c.localName;
    if(ln==='br'){o+='<br>';continue}
    const t={p:'div',b:'b',strong:'b',i:'i',em:'i',u:'u',ul:'ul',ol:'ol',li:'li',al:'al',sup:'sup',sub:'sub',table:'table',tr:'tr',td:'td',h2:'b',h3:'b'}[ln];
    const inner=x2h(c);o+=t?`<${t}>${inner}</${t}>`:inner;
  }
  return o.trim();
}
function lbParse(text){
  const x=new DOMParser().parseFromString(text,'application/xml');
  if(x.getElementsByTagName('parsererror').length)throw new Error('Die Datei ist kein gültiges XML.');
  const root=x.documentElement;
  if(root.localName!=='onlb')throw new Error('Keine ÖNORM-Leistungsbeschreibung (ONLB). Gefunden: <'+root.localName+'>');
  const kid=(n,name)=>{if(!n)return null;for(const c of n.children)if(c.localName===name)return c;return null};
  const kids=(n,name)=>n?[...n.children].filter(c=>c.localName===name):[];
  const txt=(n,name)=>kid(n,name)?.textContent.trim()||'';
  const h=n=>n?x2h(n):'';
  const kd=kid(root,'lbkenndaten');
  const cat={kennung:txt(kd,'lbkennung'),version:txt(kd,'versionsnummer'),datum:txt(kd,'versionsdatum'),bez:txt(kd,'bezeichnung'),svb:h(kid(kid(root,'svb'),'vorbemerkung')),lgs:[]};
  let n=0;
  for(const lg of kids(kid(root,'lg-liste'),'lg')){
    const e=kid(lg,'lg-eigenschaften'),L={nr:lg.getAttribute('nr'),t:txt(e,'ueberschrift'),vb:h(kid(e,'vorbemerkung')),ulgs:[]};
    for(const u of kids(kid(lg,'ulg-liste'),'ulg')){
      const ue=kid(u,'ulg-eigenschaften'),U={nr:u.getAttribute('nr'),t:txt(ue,'ueberschrift'),vb:h(kid(ue,'vorbemerkung')),gts:[]};
      for(const g of kids(kid(u,'positionen'),'grundtextnr')){
        const G={nr:g.getAttribute('nr'),gt:h(kid(kid(g,'grundtext'),'langtext')),fps:[]};
        for(const f of [...kids(g,'folgeposition'),...kids(g,'ungeteilteposition')]){
          const pe=kid(f,'pos-eigenschaften');
          G.fps.push({ft:f.getAttribute('ftnr')||'',stw:txt(pe,'stichwort'),lt:h(kid(pe,'langtext')),eh:txt(pe,'einheit')});n++;
        }
        U.gts.push(G);
      }
      L.ulgs.push(U);
    }
    cat.lgs.push(L);
  }
  cat.anzahl=n;cat.key=cat.kennung+cat.version;
  return cat;
}
async function lbListe(){if(!LBLISTE)LBLISTE=(await kvGet('lbliste').catch(()=>null))||[];return LBLISTE}
async function lbLaden(key){if(!LBC[key])LBC[key]=await kvGet('lb:'+key).catch(()=>null);return LBC[key]}
async function lbImport(el){
  const file=el.files[0];if(!file)return;
  saveState('lese Leistungsbeschreibung …');
  try{
    const cat=lbParse(await file.text());
    await kvSet('lb:'+cat.key,cat);LBC[cat.key]=cat;
    const l=(await lbListe()).filter(x=>x.key!==cat.key);
    l.push({key:cat.key,kennung:cat.kennung,version:cat.version,datum:cat.datum,bez:cat.bez,anzahl:cat.anzahl,datei:file.name});
    LBLISTE=l;await kvSet('lbliste',l);UI.lbKat=cat.key;
    alert(`${cat.bez} Version ${cat.version} (${dAT(cat.datum)}) importiert:\n${cat.lgs.length} Leistungsgruppen, ${cat.anzahl} Positionen.`);
  }catch(e){alert('Import fehlgeschlagen:\n'+e.message)}
  saveState('Gespeichert');render();
}

function lbHTML(it){let k=0;return rt(((it.gt||'')+(it.gt&&it.lang?'<br>':'')+(it.lang||'')).replace(/<al>[\s\S]*?<\/al>/g,()=>`<al>${esc(it.al?.[k++]||'')}</al>`))}

function lbInsLV(lv,cat,keys){
  // leere Platzhalter-Gruppen eines neuen LV entfernen
  lv.items=lv.items.filter(i=>!(i.typ!=='POS'&&!i.titel&&!i.vorb&&!i.nr&&!lv.items.some(p=>p.typ==='POS')));
  if(!lv.vorbLB&&cat.svb)lv.vorbLB=cat.svb;
  let neu=0;
  for(const key of keys){
    const[lg,ulg,gt,ft]=key.split('|');
    const L=cat.lgs.find(x=>x.nr===lg),U=L?.ulgs.find(x=>x.nr===ulg),G=U?.gts.find(x=>x.nr===gt),F=G?.fps.find(x=>x.ft===ft);
    if(!F||lv.items.some(i=>i.lb&&lbKey(i.lb.lg,i.lb.ulg,i.lb.gt,i.lb.ft)===key))continue;
    let li=lv.items.findIndex(i=>i.typ==='LG'&&i.nr===L.nr);
    if(li<0){
      let pos=lv.items.length;for(let j=0;j<lv.items.length;j++)if(lv.items[j].typ==='LG'&&lv.items[j].nr&&lv.items[j].nr>L.nr){pos=j;break}
      lv.items.splice(pos,0,{id:uid(),typ:'LG',nr:L.nr,titel:L.t,vorb:'',vorbLB:L.vb});li=pos;
    }
    let end=li+1;while(end<lv.items.length&&lv.items[end].typ!=='LG')end++;
    let ui=-1;for(let j=li+1;j<end;j++)if(lv.items[j].typ==='ULG'&&lv.items[j].nr===U.nr)ui=j;
    if(ui<0){let pos=end;for(let j=li+1;j<end;j++)if(lv.items[j].typ==='ULG'&&lv.items[j].nr&&lv.items[j].nr>U.nr){pos=j;break}
      lv.items.splice(pos,0,{id:uid(),typ:'ULG',nr:U.nr,titel:U.t,vorb:'',vorbLB:U.vb});ui=pos}
    let pe=ui+1;while(pe<lv.items.length&&lv.items[pe].typ==='POS'&&(!lv.items[pe].lb||(lv.items[pe].lb.gt+lv.items[pe].lb.ft)<(gt+ft)))pe++;
    const nAl=((G.gt+F.lt).match(/<al>/g)||[]).length;
    lv.items.splice(pe,0,{id:uid(),typ:'POS',lb:{kat:cat.key,lg,ulg,gt,ft},kurz:F.stw,gt:G.gt,lang:F.lt,al:Array(nAl).fill(''),menge:1,einheit:F.eh||'PA',art:'',modus:lvKB(lv)?'k7':'man',epL:0,epS:0,k7:{zeit:0,k3Id:'',teile:[]},preise:{}});
    neu++;
  }
  return neu;
}

function fibuNeu(){return{konten:KONTEN_STD.map(([nr,bez,kz])=>({nr,bez,kz:kz||''})),buchungen:[],sperre:'',
  map:{ford:'2000',verb:'3300',ust:'3500',vst:'2500',bank:'2800',kassa:'2700',verr:'2890',anz:'3200',kdSkonto:'4400',liefSkonto:'5880',

const FB=()=>DB.fibu||(DB.fibu=fibuNeu());

function fibuAuto(){
  const M=FB().map,out=[];

  const erl=c=>M.erl[c]||M.erl['20'],geld=z=>z.art==='Bar'?M.kassa:z.art==='Verrechnung'?M.verr:M.bank;
  for(const b of DB.belege){

        for(const a of s.abz)for(const x of a.steuern){add(b.datum,b.nr,`Verrechnung Anzahlung ${a.nr}`,M.anz,M.ford,x.basis,b.id);add(b.datum,b.nr,`Verrechnung Anzahlung ${a.nr} USt`,M.ust,M.ford,x.betrag,b.id)}

      for(const x of s.steuern)add(b.datum,b.nr,txt+' VSt',M.vst,M.verb,x.betrag,b.id);
      for(const z of b.zahlungen||[]){

function fibuManuell(){

    if(m.stArt&&st){const net=r2(br/(1+st/100)),tax=r2(br-net);
      if(m.stArt==='VSt'){push(m.soll,m.haben,net);push(M.vst,m.haben,tax)}else{push(m.soll,m.haben,net);push(m.soll,M.ust,tax)}}
    else push(m.soll,m.haben,br);
  }
  return out;
}
function journal(){return[...fibuAuto(),...fibuManuell()].sort((a,b)=>a.datum.localeCompare(b.datum)||String(a.beleg).localeCompare(String(b.beleg)))}
function salden(J,von,bis){
  const s={};const k=nr=>s[nr]||(s[nr]={soll:0,haben:0,vortrag:0});
  for(const e of J){
    if(e.datum>bis)continue;
    if(e.datum<von){for(const[nr,sg]of[[e.soll,1],[e.haben,-1]])if('01239'.includes(nr[0]))k(nr).vortrag+=sg*e.betrag;continue}
    k(e.soll).soll+=e.betrag;k(e.haben).haben+=e.betrag;
  }
  for(const nr in s){const x=s[nr];x.saldo=r2(x.vortrag+x.soll-x.haben)}
  return s;
}
function fibuZeitraum(){const j=UI.fbJahr||String(new Date().getFullYear()),m=UI.fbMon||'';
  if(!m)return{von:j+'-01-01',bis:j+'-12-31',label:j};
  if(m.startsWith('Q')){const q=+m[1],a=(q-1)*3+1,e=a+2;return{von:`${j}-${pad2(a)}-01`,bis:`${j}-${pad2(e)}-31`,label:`${m}/${j}`}}
  return{von:`${j}-${m}-01`,bis:`${j}-${m}-31`,label:`${m}/${j}`};
}
function guv(S_){
  const g={erl:0,mat:0,pers:0,afa:0,sba:0,fin:0,st:0};
  for(const nr in S_){const v=S_[nr].soll-S_[nr].haben,c=nr[0];
    if(c==='4')g.erl-=v;else if(c==='5')g.mat+=v;else if(c==='6')g.pers+=v;else if(c==='7'){if(nr.startsWith('70'))g.afa+=v;else g.sba+=v}
    else if(c==='8'){if(nr.startsWith('85'))g.st+=v;else g.fin-=v}}
  for(const k in g)g[k]=r2(g[k]);
  g.betrieb=r2(g.erl-g.mat-g.pers-g.afa-g.sba);g.egt=r2(g.betrieb+g.fin);g.ergebnis=r2(g.egt-g.st);
  return g;
}

function csvDownload(name,head,rows){
  const c=v=>{if(typeof v==='number')return String(r2(v)).replace('.',',');const s=String(v??'');return/[;"\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};
  const txt='﻿'+[head,...rows].map(r=>r.map(c).join(';')).join('\r\n');
  dl(new Blob([txt],{type:'text/csv;charset=utf-8'}),name);
}
function dl(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}

function docHTML(b,edit=false){

    return`<tr><td>${pnr[p.id]}</td><td><b>${p.kz==='OPT'?'OPTION: ':p.kz==='ALT'?'ALTERNATIV: ':''}${ed(`p:${i}:bez`,p.bez,'Bezeichnung')}</b>${p.nr?` <span style="color:#555">(${esc(p.nr)})</span>`:''}${p.text||edit?`<div class="lt">${ed(`p:${i}:text`,p.text,'Langtext …',true)}</div>`:''}</td>

  const tr=liste=>{let o='',g=null;const ende=()=>{if(g&&!ohneP&&!(+g.pauschal>0)&&!g.ohneEP)o+=`<tr class="gsum"><td></td><td colspan="${ncol-2}">Summe ${pnr[g.id]} ${esc(g.bez)}</td><td class="n">${fmt(gi.sumG[g.id])}</td></tr>`};
    for(const p of liste){if(p.art==='G'){ende();g=p}o+=zeile(p)}ende();return o};
  const th=`<tr><th>Pos</th><th>Bezeichnung</th><th>Menge</th><th>Einheit</th>${ohneP?'':`${ls?'<th class="n">EP Lohn</th><th class="n">EP Sonst.</th>':''}<th class="n">Einzelpreis</th>${rab?'<th class="n">Rabatt %</th>':''}${mehrSt?'<th class="n">USt</th>':''}<th class="n">Gesamtpreis</th>`}</tr>`;

  else if(['AN','AB','PR'].includes(b.typ)){zb=`Zahlungsbedingungen: ${b.zahlungsziel} Tage netto`+(+b.skonto?`, ${b.skontoTage} Tage ${fmtQ(b.skonto)} % Skonto`:'')+'. Alle Preise in EUR zuzüglich gesetzlicher Umsatzsteuer.'}
  return`<div class="doc">

  ${b.kopf||edit?`<div class="txt">${ed('h:kopf',b.kopf,'Kopftext …',true)}</div>`:''}

  ${s.steuern.map(x=>`<tr><td>${x.satz?`zzgl. Umsatzsteuer ${fmtQ(x.satz)} %${mehrSt?' auf '+fmt(x.basis):''}`:esc(x.bez)+' '+fmt(x.basis)}</td><td class="n">${fmt(x.betrag)} €</td></tr>`).join('')}
  <tr class="b g"><td>Gesamtbetrag</td><td class="n">${fmt(s.brutto)} €</td></tr>

function drucken(b){

  pdown:el=>{const b=curBeleg(),i=+el.dataset.i;if(i<b.pos.length-1){[b.pos[i+1],b.pos[i]]=[b.pos[i],b.pos[i+1]];persist();render()}},

  mkart:el=>{const b=curBeleg(),p=b.pos[+el.dataset.i];if(!p.bez){alert('Bitte zuerst eine Bezeichnung eingeben.');return}
    const nr=prompt('Artikel-Nr. für „'+p.bez+'“:',p.nr||String(++S().anr).padStart(5,'0'));if(!nr)return;
    if(DB.artikel.some(a=>a.nr===nr)){alert('Artikel-Nr. existiert bereits.');return}
    const f=+p.faktor||1,V_=T[b.typ].b==='V';
    const a={id:uid(),nr,bez:p.bez,text:p.text,art:isInfo(p)?'W':p.art,einheit:p.einheit,einheiten:[],ek:r2((V_?+p.ek:+p.ep)/f),vk:V_?r2(+p.ep/f):0,steuer:p.steuer,lager:false,minBestand:0,lieferanten:V_?[]:[{kontaktId:b.kontaktId,artNr:''}],aktiv:true};
    DB.artikel.push(a);p.artikelId=a.id;p.nr=nr;artDatalist();persist();render()},
  pzeit:()=>{const b=curBeleg();const zt=DB.zeiten.filter(z=>z.auftragId===b.auftragId&&!z.belegId);if(!zt.length){alert('Keine offenen Stunden für diesen Auftrag.');return}zeitenInPos(b,zt);persist();render()},
  zadd:()=>{const b=curBeleg(),bet=num($('#z-bet').value),sk=num($('#z-sk').value);if(!bet&&!sk)return;if(FB().sperre&&($('#z-dat').value||isoD())<=FB().sperre){alert('Periode bis '+dAT(FB().sperre)+' ist gesperrt.');return}

  zdel:el=>{const b=curBeleg(),z=b.zahlungen[+el.dataset.i];if(!confirm(`Zahlung ${fmt(z.betrag)} vom ${dAT(z.datum)} löschen?`))return;b.zahlungen.splice(+el.dataset.i,1);log('Zahlung gelöscht',`${b.nr}: ${fmt(z.betrag)}`);commit();render()},
  abe:el=>{const b=neuBeleg('BE',{auftragId:el.dataset.id,betreff:'Projekt: '+(beleg(el.dataset.id)?.betreff||'')});persist();go('beleg/'+b.id)},
  aer:el=>{const b=neuBeleg('ER',{auftragId:el.dataset.id,kopf:'',fuss:''});persist();go('beleg/'+b.id)},
  zabr:el=>zeitenAbrechnen(el.dataset.id),
  ztadd:()=>{const a=$('#zt-a').value,t=$('#zt-t').value,h=num($('#zt-h').value);if(!a||!h){alert('Auftrag und Stunden angeben.');return}

    DB.zeiten.push({id:uid(),datum:$('#zt-d').value||isoD(),auftragId:a,tarif:t,stunden:h,text:$('#zt-x').value,kosten:+tf.kosten||0,vk:+tf.vk||0,belegId:''});commit();render()},
  ztdel:el=>{const i=DB.zeiten.findIndex(z=>z.id===el.dataset.id);if(i>=0&&confirm('Eintrag löschen?')){DB.zeiten.splice(i,1);commit();render()}},
  knew:el=>{const t=el.dataset.t,s=S();const k={id:uid(),nr:String(++s.knr[t]),typ:t,name:'',zusatz:'',strasse:'',plz:'',ort:'',land:'Österreich',uid:'',email:'',tel:'',zahlungsziel:s.zahlungsziel,notiz:''};DB.kontakte.push(k);persist();go('kontakt/'+k.id);setTimeout(()=>$('[data-f="name"]')?.focus(),30)},
  kdel:el=>{const id=el.dataset.id;if(DB.belege.some(b=>b.kontaktId===id)){alert('Kontakt hat Belege und kann nicht gelöscht werden.');return}if(!confirm('Kontakt löschen?'))return;DB.kontakte=DB.kontakte.filter(k=>k.id!==id);persist();go('kontakte')},
  kbel:el=>{const b=neuBeleg(el.dataset.t,{kontaktId:el.dataset.id,zahlungsziel:+kontakt(el.dataset.id).zahlungsziel||S().zahlungsziel});persist();go('beleg/'+b.id)},
  anew:()=>{const s=S(),nr=String(++s.anr).padStart(5,'0');const a={id:uid(),nr,bez:'',text:'',art:'W',einheit:'Stk',einheiten:[],ek:0,vk:0,steuer:s.stdSteuer,lager:false,minBestand:0,lieferanten:[],aktiv:true};DB.artikel.push(a);persist();go('artikel/'+a.id)},
  adel:el=>{const id=el.dataset.id;if(DB.belege.some(b=>b.pos.some(p=>p.artikelId===id))||DB.lager.some(e=>e.artikelId===id)){alert('Artikel wird verwendet – stattdessen „aktiv“ abwählen.');return}if(!confirm('Artikel löschen?'))return;DB.artikel=DB.artikel.filter(a=>a.id!==id);artDatalist();persist();go('artikel')},

    let menge=m==='ist'?r3(q-bestand(a).menge):q;if(!menge){alert('Keine Mengenänderung.');return}
    lagerBuchung({artikelId:a,menge,preis:p!==''?num(p):null,datum:$('#lg-d').value||isoD(),text:(m==='ist'?'Inventur':'Korrektur')+(t?': '+t:'')});
    log('Lagerbuchung',`${artikel(a).nr}: ${fmtQ(menge)}`);commit();render()},

  tfadd:()=>{S().tarife.push({kz:'NEU',bez:'',kosten:0,vk:0});persist();render()},

  attopen:async el=>{const a=curBeleg().anhaenge[+el.dataset.i];try{await STORE.openFile(a)}catch(e){alert('Öffnen fehlgeschlagen: '+e.message)}},
  attdel:el=>{const b=curBeleg(),a=b.anhaenge[+el.dataset.i];if(!confirm(`Verknüpfung zu „${a.name}“ entfernen?\n(Die Datei selbst bleibt im Speicherort erhalten.)`))return;b.anhaenge.splice(+el.dataset.i,1);log('Anhang entfernt',`${bNr(b)}: ${a.name}`);persist();render()},

Object.assign(ACT,ACT_LV,ACT_LB,ACT_FB);
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');
  if(!el){if(!e.target.closest('.pop'))closePop();return}
  if(el.tagName==='SELECT')return;
  ACT[el.dataset.act]?.(el,e);
});
document.addEventListener('change',e=>{
  const el=e.target,d=el.dataset;
  if(el.tagName==='SELECT'&&d.act){ACT[d.act]?.(el,e);return}
  if(el.id==='logo')return logoUpload(el);
  if(el.id==='imp')return importJSON(el);
  if(el.id==='lbimp')return lbImport(el);
  if(el.id==='att'){const b=curBeleg();if(b)anhaengeHochladen(b,[...el.files]);return}
  if(el.id==='erfoto'){const files=[...el.files];if(!files.length)return;const b=neuBeleg('ER',{kopf:'',fuss:''});go('beleg/'+b.id);anhaengeHochladen(b,files);return}
  const v=el.type==='checkbox'?el.checked:el.value,nv=el.type==='number'?num(v):v;
  if(d.p!==undefined){const b=curBeleg();if(!b||b.fest)return;onPos(b,+d.p,d.f,v);persist();return}
  if(d.h){const b=curBeleg();if(!b||b.fest)return;onHead(b,d.h,el.type==='number'?num(v):v);persist();return}
  switch(d.o){
    case'ui':UI[d.f]=v;render();return;
    case'lbsel':{const s=UI.lbSel||(UI.lbSel=[]),i=s.indexOf(d.k);if(el.checked&&i<0)s.push(d.k);if(!el.checked&&i>=0)s.splice(i,1);const z=document.querySelector('.lbsel b');if(z)z.textContent=s.length;const bt=document.querySelector('[data-act=lbins]');if(bt)bt.disabled=!(s.length&&UI.lbZiel);return}
    case'path':{const[c,id]=d.r.split('|'),o=ROOT[c](id);if(!o)return;if(c==='lv')lvBieterPreisInit(o,d.f);setP(o,d.f,d.t==='n'?num(v):el.type==='checkbox'?el.checked:v);persist();renderErhalten();return}
    case'k':{const k=kontakt(d.id);k[d.f]=nv;break}
    case'a':{const a=artikel(d.id);if(d.f==='einheitenStr'){a.einheiten=String(v).split(/[;,]/).map(x=>x.split('=')).filter(x=>x.length===2&&x[0].trim()&&num(x[1])>0).map(([e,f])=>({e:e.trim(),f:num(f)}));for(const x of a.einheiten)if(!S().einheiten.includes(x.e))S().einheiten.push(x.e)}else a[d.f]=nv;if(['nr','bez','aktiv'].includes(d.f))artDatalist();if(['lager','einheitenStr'].includes(d.f)){persist();render();return}break}
    case'al':artikel(d.id).lieferanten[+d.i][d.f]=v;break;
    case's':if(d.f==='einheitenStr')S().einheiten=String(v).split(',').map(x=>x.trim()).filter(Boolean);else{const pth=d.f.split('.');let o=S();while(pth.length>1)o=o[pth.shift()];o[pth[0]]=nv}break;
    case'st':{const x=S().steuer[+d.i];if(d.f==='code'){const alt=x.code;if(S().steuer.some((y,j)=>j!==+d.i&&y.code===v)){alert('Code existiert bereits.');render();return}if(DB.belege.some(b=>b.pos.some(p=>p.steuer===alt))){alert('Code wird verwendet und kann nicht geändert werden.');render();return}}x[d.f]=nv;break}
    case'tf':S().tarife[+d.i][d.f]=nv;break;
    case'fbk':FB().konten[+d.i][d.f]=v;break;
    case'fbmap':{if(d.f==='!sperre'){FB().sperre=v;log('Periodensperre',v)}else setP(FB().map,d.f,v);break}
    case'nk':{const j=String(new Date().getFullYear()),nk=S().nk[d.t];if(d.f==='prefix')nk.prefix=v.trim()||d.t;else{const used=DB.belege.filter(b=>b.typ===d.t&&b.nr&&b.nr.includes('-'+j+'-')).length;if(used&&num(v)<(nk.zaehler[j]||0)&&!confirm('Achtung: Zähler kleiner als bereits vergebene Nummern – Doppelvergabe möglich. Trotzdem setzen?')){render();return}nk.zaehler[j]=Math.max(0,Math.floor(num(v)))}log('Nummernkreis',`${d.t}: ${d.f}=${v}`);break}
    case'tx':S().texte[d.t][d.f]=v;break;
    default:return;
  }
  persist();
});
function onHead(b,f,v){
  b[f]=v;
  if(f==='optRabatt'||f==='optLS'){if(f==='optLS'&&v)for(const p of b.pos)if(!isInfo(p)&&p.epL==null&&p.epS==null){p.epL=p.art==='L'?+p.ep||0:0;p.epS=p.art==='L'?0:+p.ep||0}render();return}
  if(f==='kontaktId'){const k=kontakt(v);if(k&&k.zahlungsziel!==''&&k.zahlungsziel!=null&&T[b.typ].b==='V')b.zahlungsziel=+k.zahlungsziel;render()}
  if(f==='datum'&&b.typ==='AN'){b.gueltigBis=addDays(v,S().angebotGueltig);render()}
  updateCalc(b);
}
function onPos(b,i,f,v){
  const p=b.pos[i];
  if(f==='artikel'){
    const s=String(v).trim(),a=DB.artikel.find(a=>a.aktiv!==false&&(`${a.nr} – ${a.bez}`===s||a.nr===s));
    if(a){artikelInPos(b,p,a);renderFocus(`[data-p="${i}"][data-f="menge"]`)}else{p.artikelId='';p.nr=s}
    return;
  }
  if(f==='einheit'){
    const a=artikel(p.artikelId),alt=a?.einheiten?.find(x=>x.e===v),nf=alt?+alt.f:1;
    if(a){const r=nf/(+p.faktor||1);p.ep=r2(p.ep*r);p.ek=r2(p.ek*r)}
    p.einheit=v;p.faktor=nf;render();return;
  }
  p[f]=['menge','ep','rabatt','ek','pauschal','epL','epS'].includes(f)?num(v):v;
  if(f==='epL'||f==='epS'){p.ep=r2((+p.epL||0)+(+p.epS||0));const e=document.querySelector(`[data-p="${i}"][data-f="ep"]`);if(e)e.value=p.ep}
  if(['art','pauschal','ohneEP','kz'].includes(f)&&(f!=='kz'||p.art==='G'))render();else updateCalc(b);
}
/* Formatierungsleiste für Texte (fett, kursiv, unterstrichen, Listen) */
(function(){
  const bar=document.createElement('div');bar.id='rtebar';
  bar.innerHTML=[['bold','<b>F</b>','Fett (Strg+B)'],['italic','<i>K</i>','Kursiv (Strg+I)'],['underline','<u>U</u>','Unterstrichen (Strg+U)'],['insertUnorderedList','•','Aufzählung'],['insertOrderedList','1.','Nummerierung'],['removeFormat','⌫','Formatierung entfernen']]
    .map(([c,l,t])=>`<button type="button" data-cmd="${c}" title="${t}">${l}</button>`).join('');
  document.body.appendChild(bar);
  bar.addEventListener('mousedown',e=>{e.preventDefault();const c=e.target.closest('[data-cmd]')?.dataset.cmd;if(c)document.execCommand(c,false,null)});
  document.addEventListener('focusin',e=>{
    const el=e.target.closest?.('.rte[contenteditable],.ed.ml');
    if(!el){bar.style.display='none';return}
    const r=el.getBoundingClientRect();bar.style.display='flex';
    bar.style.top=Math.max(4,r.top+scrollY-34)+'px';bar.style.left=Math.max(4,r.left+scrollX)+'px';
  });
  document.addEventListener('focusout',e=>{setTimeout(()=>{if(!document.activeElement?.closest?.('.rte,.ed.ml'))bar.style.display='none'},0)});
})();
function logoUpload(el){
  const file=el.files[0];if(!file)return;
  if(file.size>300*1024){alert('Logo zu groß (max. 300 kB).');return}
  const r=new FileReader();r.onload=()=>{S().firma.logo=r.result;persist();render()};r.readAsDataURL(file);
}
function importJSON(el){
  const file=el.files[0];if(!file)return;
  const r=new FileReader();r.onload=()=>{
    try{const d=JSON.parse(r.result);if(!d.settings||!Array.isArray(d.belege))throw new Error('Keine ERP-Lite-Datei.');
      if(!confirm(`Import ersetzt ALLE aktuellen Daten (${DB.belege.length} Belege) durch die Datei (${d.belege.length} Belege). Fortfahren?`))return;
      DB=migrate(d);log('Import',file.name);artDatalist();commit();go('dash')}
    catch(e){alert('Import fehlgeschlagen: '+e.message)}
  };r.readAsText(file);
}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closePop();if((e.ctrlKey||e.metaKey)&&e.key==='s'){e.preventDefault();commit()}});
$('#menu').onclick=e=>{e.stopPropagation();document.body.classList.toggle('nav')};
document.querySelector('nav').addEventListener('click',e=>{if(e.target.closest('a'))document.body.classList.remove('nav')});
document.addEventListener('click',e=>{if(document.body.classList.contains('nav')&&!e.target.closest('nav'))document.body.classList.remove('nav')});

start();
