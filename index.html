:root{--bg:#f4f5f7;--card:#fff;--ink:#1d2330;--mut:#6b7280;--line:#e2e5ea;--acc:#1f5fbf;--acc2:#e8f0fc;--ok:#1e7a46;--warn:#9a5b00;--err:#b42318;--side:#1d2330}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 Mulish,"Segoe UI",system-ui,sans-serif;color:var(--ink);background:var(--bg)}
#app{display:none;min-height:100vh}
body.loaded #app{display:flex}
.topbar{display:none}
.quick{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.quick>*{flex:1 1 140px;text-align:center;padding:12px 10px;font-weight:600}
.att{display:flex;gap:8px;align-items:center;padding:4px 0;border-bottom:1px solid #eef0f3}
.seg{display:inline-flex;border:1px solid #cdd2da;border-radius:6px;overflow:hidden}
.seg button{border:0;border-radius:0;border-right:1px solid #e2e5ea}.seg button:last-child{border-right:0}
.seg button.on{background:var(--acc2);color:var(--acc);font-weight:600}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start}
.split .sticky{position:sticky;top:10px;max-height:calc(100vh - 20px);overflow:auto}
.blatt{background:#fff;color:#000;max-width:210mm;min-height:120mm;margin:0 auto 14px;padding:14mm 13mm 12mm 17mm;box-shadow:0 2px 14px rgba(0,0,0,.12);border:1px solid var(--line)}
.blatt .doc .ft{position:static;margin-top:12mm}
.blatt .doc .hd{margin-bottom:9mm}
.ed{outline:1px dashed #9db8e6;outline-offset:1px;border-radius:2px;min-width:24px;display:inline-block;cursor:text}
.ed.ml{display:block;min-height:1.3em}
.ed:hover{background:#f5f8ff}
.ed:focus{outline:2px solid var(--acc);background:#eef4ff}
.ed:empty:before{content:attr(data-ph);color:#9aa3b2;font-weight:400}
.modal{position:fixed;inset:0;background:rgba(15,20,30,.45);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:10vh 12px 12px}
.mbox{background:#fff;border-radius:10px;max-width:520px;width:100%;padding:18px 20px;box-shadow:0 12px 40px rgba(0,0,0,.3)}
.mtab td{border:0;padding:3px 10px 3px 0}
.mwarn{background:#fde8e6;border:1px solid #f4b8b1;color:#7a1a12;border-radius:6px;padding:9px 11px;margin-top:10px;font-size:13px}
label.chk{display:flex;gap:8px;align-items:center;color:var(--ink);font-size:14px;margin-top:12px;cursor:pointer}
label.chk input{width:18px;height:18px}
button.gef{background:var(--err);border-color:var(--err)}
.lbcols{display:grid;grid-template-columns:260px 300px 1fr;gap:10px;align-items:start}.lblist{max-height:70vh;overflow:auto;padding:6px}.lblist a{display:block;padding:4px 6px;border-radius:4px;cursor:pointer;font-size:13px}.lblist a:hover{background:var(--acc2)}.lblist a.on{background:var(--acc);color:#fff}
.lbgt{border-top:1px solid var(--line);padding:6px 0}.lbfp{display:flex;gap:10px;align-items:center;padding:3px 0;font-size:13px;cursor:pointer;color:var(--ink)}.lbfp input{width:16px;height:16px}.lbft{margin-left:26px}.lbft summary{font-size:11px}
.lbsel{position:sticky;bottom:0;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 12px;display:flex;gap:8px;align-items:center;box-shadow:0 -4px 16px rgba(0,0,0,.08);margin-top:10px}.lbsel select{width:auto}
.rte table,.doc .lt table{border-collapse:collapse;margin:3px 0}.rte td,.doc .lt td{border:1px solid #ccc;padding:2px 5px;font-size:inherit}
@media(max-width:1000px){.lbcols{grid-template-columns:1fr}.lblist{max-height:30vh}}
#dirtybar{position:fixed;left:50%;transform:translateX(-50%);bottom:16px;z-index:60;background:#1d2330;color:#fff;border-radius:10px;padding:8px 10px 8px 16px;display:flex;gap:10px;align-items:center;box-shadow:0 8px 30px rgba(0,0,0,.3);min-width:360px}
#dirtybar span:first-child{color:#ffd27a}
#dirtybar button:not(.p){color:var(--ink)}
@media(max-width:760px){#dirtybar{left:8px;right:8px;transform:none;min-width:0;bottom:8px}}
.rte{border:1px solid #cdd2da;border-radius:5px;padding:5px 7px;min-height:32px;background:#fff;margin-top:2px;color:var(--ink);font-size:13px;line-height:1.4;cursor:text}
.rte[contenteditable]:focus{outline:2px solid var(--acc);outline-offset:-1px}
.rte:not([contenteditable]){background:#f3f4f6}
.rte:empty:before{content:attr(data-ph);color:#9aa3b2}
.rte ul,.rte ol,.doc ul,.doc ol{margin:2px 0;padding-left:20px}
#rtebar{position:absolute;z-index:70;display:none;gap:2px;background:#1d2330;border-radius:6px;padding:3px}
#rtebar button{background:none;border:0;color:#fff;padding:3px 9px;font-size:13px}#rtebar button:hover{background:#2c3446}
table.pos tr.grp td{background:#eef2f8;border-top:2px solid #c9d4e6}
table.pos tr.ing td:first-child{border-left:3px solid #c9d4e6}
.doc tr.grpz td{padding-top:3mm;border-bottom:1px solid #999}
.doc tr.gsum td{font-weight:700;border-bottom:1px solid #999;text-align:right}
.doc tr.gsum td.n{text-align:right}
al{display:inline-block;min-width:60px;border-bottom:1px dotted #888;background:#fff7d6}
al:empty::before{content:'……'}
table.k td{padding:3px 5px;vertical-align:middle}table.k input,table.k select{padding:3px 6px}

<script>
'use strict';
/* =====================================================================
   ERP-Lite – Einzelplatz-ERP für Handel + Dienstleistung (Österreich)
   Daten: erp-daten.json im gewählten Ordner (File System Access API)
   ===================================================================== */
/* ===================== KONFIGURATION =====================
   Nach der App-Registrierung in Microsoft Entra eintragen
   (siehe ANLEITUNG-MOBIL.md). Diese Werte sind nicht geheim. */
const CONFIG={
  clientId:'',          // Anwendungs-ID (Client), z. B. '1a2b3c4d-....'
  tenantId:'',          // Verzeichnis-ID (Mandant)
  ordner:'ERP-Lite',    // Ordner im OneDrive für Daten, Sicherungen und Anhänge
};
/* ========================================================== */
const FILE='erp-daten.json';
const T={
  AN:{bez:'Angebot',b:'V',folge:['AB','AR','LS','RE','PR']},
  AB:{bez:'Auftragsbestätigung',b:'V',folge:['LS','AR','TR','RE','SR','PR','BE']},
  PR:{bez:'Proformarechnung',b:'V',folge:[]},
  LS:{bez:'Lieferschein',b:'V',folge:['RE','SR']},
  AR:{bez:'Anzahlungsrechnung',b:'V',re:1,folge:['GS']},
  TR:{bez:'Teilrechnung',b:'V',re:1,folge:['GS']},
  RE:{bez:'Rechnung',b:'V',re:1,folge:['GS']},
  SR:{bez:'Schlussrechnung',b:'V',re:1,folge:['GS']},
  GS:{bez:'Gutschrift',b:'V',re:1,folge:[]},
  BE:{bez:'Bestellung',b:'E',folge:['WE','ER']},
  WE:{bez:'Wareneingang',b:'E',folge:['ER']},
  ER:{bez:'Eingangsrechnung',b:'E',re:1,folge:[]},
};
const RE_V=['AR','TR','RE','SR','GS'];
const ART={W:'Ware',L:'Leistung',F:'Fremdleistung',G:'Gruppe',T:'Text'};
const showRab=b=>!!b.optRabatt||b.pos.some(p=>+p.rabatt);
// Positionsnummern: ohne Gruppen 1,2,3 – mit Gruppen 1, 1.01, 1.02, 2, 2.01 …
function posNummern(b){
  const m={},hatG=b.pos.some(p=>p.art==='G');let g=0,k=0,n=0;
  for(const p of b.pos){
    if(p.art==='T')continue;
    if(p.art==='G'){g++;k=0;m[p.id]=String(g);continue}
    if(hatG&&g){k++;m[p.id]=`${g}.${String(k).padStart(2,'0')}`}else{n++;m[p.id]=String(n)}
  }
  return m;
}
/* Formatierter Text: erlaubt sind fett, kursiv, unterstrichen, Listen, Zeilenumbrüche (+ <al> = Ausschreiberlücke aus ÖNORM-LB) */
const RT_OK={B:'b',STRONG:'b',I:'i',EM:'i',U:'u',UL:'ul',OL:'ol',LI:'li',DIV:'div',P:'div',AL:'al',SUP:'sup',SUB:'sub',TABLE:'table',TBODY:'tbody',TR:'tr',TD:'td'};
function clean(html){
  const d=new DOMParser().parseFromString('<div>'+String(html||'')+'</div>','text/html');
  const walk=n=>{let o='';for(const c of n.childNodes){
    if(c.nodeType===3){o+=esc(c.nodeValue);continue}
    if(c.nodeType!==1||/^(SCRIPT|STYLE|IFRAME|OBJECT|TEMPLATE)$/.test(c.tagName))continue;
    if(c.tagName==='BR'){o+='<br>';continue}
    let inner=walk(c);
    if(c.tagName==='SPAN'||c.tagName==='FONT'){const st=c.getAttribute('style')||'';if(/font-weight:\s*(bold|[6-9]00)/.test(st))inner=`<b>${inner}</b>`;if(/font-style:\s*italic/.test(st))inner=`<i>${inner}</i>`;if(/underline/.test(st))inner=`<u>${inner}</u>`}
    const t=RT_OK[c.tagName];o+=t?`<${t}>${inner}</${t}>`:inner;
  }return o};
  return walk(d.body.firstElementChild).replace(/^(\s|<br>)+|(\s|<br>)+$/g,'');
}
const istHTML=s=>/<(b|i|u|br|ul|ol|li|div|al)\b/i.test(String(s||''));
function rt(s){if(!s)return'';return istHTML(s)?clean(s):esc(s).replace(/\n/g,'<br>')}
function rtText(s){const d=document.createElement('div');d.innerHTML=rt(s).replace(/<br>|<\/div>|<\/li>/g,'\n');return d.textContent.trim()}
const OHNE_PREIS=['LS','WE'];
const REOPEN=['AN','AB','BE','PR'];

let DB=null,saveT=null,pending=false,lastBackupDay=null,HIST=null;
const UI={vTyp:'',vSt:'',vQ:'',eTyp:'',eSt:'',eQ:'',jahr:String(new Date().getFullYear()),kQ:'',aQ:''};

/* ---------- Hilfsfunktionen ---------- */
const $=s=>document.querySelector(s);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const r2=x=>Math.round(((+x)||0)*100+Number.EPSILON*100)/100;
const r3=x=>Math.round(((+x)||0)*1000)/1000;
const num=v=>{const n=parseFloat(String(v??'').replace(',','.'));return isNaN(n)?0:n};
const fmt=n=>(+n||0).toLocaleString('de-AT',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtQ=n=>(+n||0).toLocaleString('de-AT',{maximumFractionDigits:3});
const pct=n=>isFinite(n)?(n*100).toLocaleString('de-AT',{minimumFractionDigits:1,maximumFractionDigits:1})+' %':'–';
const isoD=(d=new Date())=>new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10);
const addDays=(iso,n)=>{const d=new Date(iso+'T12:00:00');d.setDate(d.getDate()+(+n||0));return isoD(d)};
const dAT=iso=>iso?iso.slice(8,10)+'.'+iso.slice(5,7)+'.'+iso.slice(0,4):'';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sum=(a,f)=>r2(a.reduce((s,x)=>s+(+f(x)||0),0));
const tag=(t,c='')=>`<span class="tag ${c}">${t}</span>`;
const S=()=>DB.settings;
const kontakt=id=>DB.kontakte.find(k=>k.id===id);
const artikel=id=>id?DB.artikel.find(a=>a.id===id):null;
const beleg=id=>id?DB.belege.find(b=>b.id===id):null;
const kName=id=>kontakt(id)?.name||'–';
const bNr=b=>b?(b.nr||'Entwurf'):'';
const steuerDef=c=>S().steuer.find(s=>s.code===c)||{code:c,satz:0,bez:c,hinweis:''};
const opt=(v,t,sel)=>`<option value="${esc(v)}"${String(v)===String(sel)?' selected':''}>${esc(t)}</option>`;
function log(aktion,info){DB.log.push({ts:new Date().toISOString(),aktion,info})}
/* Navigation: go() = vom Programm ausgelöst (ohne Rückfrage), nav() = vom Benutzer (mit Rückfrage bei ungespeicherten Änderungen) */
let DIRTY=false,SNAP=null,SKIP=false,CURHASH='';
function go(h){if(location.hash==='#/'+h){render();return}SKIP=true;location.hash='#/'+h}
function nav(h){location.hash='#/'+h}
const isInfo=p=>p.art==='T'||p.art==='G';

/* ---------- Datenbank ---------- */
function neueDB(){
  const nk={},texte={};
  for(const t in T){nk[t]={prefix:t,zaehler:{}};texte[t]={kopf:'',fuss:''}}
  texte.AN={kopf:'Vielen Dank für Ihre Anfrage. Wir bieten Ihnen wie folgt an:',fuss:'Wir freuen uns auf Ihren Auftrag.'};
  texte.AB={kopf:'Vielen Dank für Ihren Auftrag, den wir wie folgt bestätigen:',fuss:''};
  texte.RE={kopf:'Wir erlauben uns, wie folgt zu verrechnen:',fuss:'Vielen Dank für Ihren Auftrag.'};
  texte.BE={kopf:'Wir bestellen zu Ihren Bedingungen wie folgt:',fuss:'Bitte bestätigen Sie Liefertermin und Preis.'};
  return{
    meta:{version:1,erstellt:new Date().toISOString(),app:'ERP-Lite'},
    settings:{
      firma:{name:'',zusatz:'',strasse:'',plz:'',ort:'',land:'Österreich',uid:'',fn:'',gericht:'',tel:'',mail:'',web:'',bank:'',iban:'',bic:'',logo:'',slogan:'',zeichner:'',zeichnerFkt:'Geschäftsführung'},
      bearbeiter:'',
      steuer:[
        {code:'20',satz:20,bez:'20 % USt',hinweis:''},
        {code:'13',satz:13,bez:'13 % USt',hinweis:''},
        {code:'10',satz:10,bez:'10 % USt',hinweis:''},
        {code:'0',satz:0,bez:'steuerfrei',hinweis:''},
        {code:'RC',satz:0,bez:'Reverse Charge',hinweis:'Die Steuerschuld geht auf den Leistungsempfänger über (Reverse Charge).'},
        {code:'IGL',satz:0,bez:'ig. Lieferung',hinweis:'Steuerfreie innergemeinschaftliche Lieferung.'},
      ],
      stdSteuer:'20',
      einheiten:['Stk','m','m²','m³','h','PA','kg','l','Krt','Rolle','Set','km','Tag','Wo','Mon'],
      tarife:[{kz:'SV',bez:'Sachverständigenleistung',kosten:0,vk:0},{kz:'MONT',bez:'Montage',kosten:0,vk:0},{kz:'FAHRT',bez:'Fahrtzeit',kosten:0,vk:0}],
      nk,texte,knr:{K:10000,L:70000},anr:0,
      zahlungsziel:14,skonto:0,skontoTage:0,angebotGueltig:30,zielDB2:25,mgz:0,besteuerung:'soll',abwGrenze:20,lvnr:0
    },
    kontakte:[],artikel:[],belege:[],lager:[],zeiten:[],kalk:[],lv:[],lvbib:[],fibu:fibuNeu(),log:[]
  };
}
function migrate(d){
  const n=neueDB();
  for(const k in n)if(d[k]===undefined)d[k]=n[k];
  for(const k in n.settings)if(d.settings[k]===undefined)d.settings[k]=n.settings[k];
  for(const k in n.settings.firma)if(d.settings.firma[k]===undefined)d.settings.firma[k]=n.settings.firma[k];
  for(const t in T){if(!d.settings.nk[t])d.settings.nk[t]={prefix:t,zaehler:{}};if(!d.settings.texte[t])d.settings.texte[t]={kopf:'',fuss:''}}
  return d;
}
function nextNr(typ,datum){
  const nk=S().nk[typ],j=datum.slice(0,4),n=(nk.zaehler[j]||0)+1;
  nk.zaehler[j]=n;return`${nk.prefix}-${j}-${String(n).padStart(4,'0')}`;
}

function idbOpen(){return new Promise((res,rej)=>{const r=indexedDB.open('erp-lite',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function kvGet(k){const db=await idbOpen();return new Promise(r=>{const q=db.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)})}
async function kvSet(k,v){const db=await idbOpen();return new Promise(r=>{const tx=db.transaction('kv','readwrite');tx.objectStore('kv').put(v,k);tx.oncomplete=()=>r();tx.onerror=()=>r()})}
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const lsSet=(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}};

/* ---------- Anmeldung Microsoft 365 (OAuth 2.0 Code-Flow mit PKCE, ohne Fremdbibliothek) ---------- */
const SCOPES='openid profile offline_access User.Read Files.ReadWrite';
const odCfg=()=>({clientId:CONFIG.clientId||lsGet('erp-cid')||'',tenant:CONFIG.tenantId||lsGet('erp-tid')||'organizations',ordner:CONFIG.ordner||'ERP-Lite'});
const redirectUri=()=>location.origin+location.pathname.replace(/index\.html$/,'');
const b64u=buf=>btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const rnd=n=>b64u(crypto.getRandomValues(new Uint8Array(n)));
const AUTH={
  _p:null,
  tok(){try{return JSON.parse(lsGet('erp-tok')||'null')}catch(e){return null}},
  setTok(t){lsSet('erp-tok',t?JSON.stringify(t):null)},
  async login(){
    const c=odCfg();if(!c.clientId){alert('Client-ID fehlt (siehe Anleitung).');return}
    if(!window.isSecureContext||!crypto.subtle){alert('Die Anmeldung funktioniert nur über https:// (oder localhost).');return}
    const verifier=rnd(48),challenge=b64u(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(verifier))),state=rnd(16);
    sessionStorage.setItem('erp-pkce',JSON.stringify({verifier,state,hash:location.hash}));
    const q=new URLSearchParams({client_id:c.clientId,response_type:'code',redirect_uri:redirectUri(),response_mode:'query',scope:SCOPES,code_challenge:challenge,code_challenge_method:'S256',state});
    const hint=lsGet('erp-user');if(hint)q.set('login_hint',hint);else q.set('prompt','select_account');
    location.href=`https://login.microsoftonline.com/${encodeURIComponent(c.tenant)}/oauth2/v2.0/authorize?${q}`;
  },
  async redirectVerarbeiten(){
    const p=new URLSearchParams(location.search);
    if(!p.has('code')&&!p.has('error'))return false;
    let pk=null;try{pk=JSON.parse(sessionStorage.getItem('erp-pkce')||'null')}catch(e){}
    sessionStorage.removeItem('erp-pkce');
    history.replaceState(null,'',location.pathname+(pk?.hash||''));
    if(p.has('error')){alert('Anmeldung fehlgeschlagen:\n'+(p.get('error_description')||p.get('error')));return false}
    if(!pk||pk.state!==p.get('state')){alert('Anmeldung ungültig – bitte erneut anmelden.');return false}
    const c=odCfg();
    const r=await fetch(`https://login.microsoftonline.com/${encodeURIComponent(c.tenant)}/oauth2/v2.0/token`,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},
      body:new URLSearchParams({client_id:c.clientId,grant_type:'authorization_code',code:p.get('code'),redirect_uri:redirectUri(),code_verifier:pk.verifier,scope:SCOPES})});
    const j=await r.json().catch(()=>({}));
    if(!r.ok){alert('Anmeldung fehlgeschlagen:\n'+(j.error_description||j.error||r.status));return false}
    this.merke(j);return true;
  },
  merke(j){
    this.setTok({access:j.access_token,refresh:j.refresh_token||this.tok()?.refresh,exp:Date.now()+((+j.expires_in||3600)-120)*1000});
    try{const id=JSON.parse(atob(j.id_token.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')));if(id.preferred_username)lsSet('erp-user',id.preferred_username)}catch(e){}
  },
  async token(){
    const t=this.tok();if(!t)return null;
    if(t.access&&Date.now()<t.exp)return t.access;
    if(!t.refresh)return null;
    if(!this._p)this._p=(async()=>{
      const c=odCfg();
      const r=await fetch(`https://login.microsoftonline.com/${encodeURIComponent(c.tenant)}/oauth2/v2.0/token`,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},
        body:new URLSearchParams({client_id:c.clientId,grant_type:'refresh_token',refresh_token:t.refresh,scope:SCOPES})});
      const j=await r.json().catch(()=>({}));
      if(!r.ok){this.setTok(null);return null}
      this.merke(j);return j.access_token;
    })().finally(()=>{this._p=null});
    return this._p;
  },
  abmelden(){if(pending&&!confirm('Es gibt noch nicht gespeicherte Änderungen. Trotzdem abmelden?'))return;this.setTok(null);lsSet('erp-user',null);lsSet('erp-modus',null);location.hash='';location.reload()}
};
async function graph(path,opt={},nochmal=true){
  const t=await AUTH.token();
  if(!t)throw Object.assign(new Error('Anmeldung abgelaufen'),{login:true});
  const r=await fetch('https://graph.microsoft.com/v1.0'+path,{...opt,headers:{Authorization:'Bearer '+t,...(opt.headers||{})}});
  if(r.status===401&&nochmal){const x=AUTH.tok();if(x)AUTH.setTok({...x,exp:0});return graph(path,opt,false)}
  return r;
}
const odPath=p=>'/me/drive/root:/'+[odCfg().ordner,...p.split('/')].map(encodeURIComponent).join('/');

/* ---------- Speicherorte: OneDrive / lokaler Ordner / nur Browser ---------- */
const ODSTORE={
  art:'od',etag:null,lastText:null,
  get name(){return`OneDrive (${lsGet('erp-user')||'angemeldet'}) / ${odCfg().ordner}`},
  async meta(){const r=await graph(odPath(FILE)+'?$select=id,eTag');if(r.status===404)return null;if(!r.ok)throw new Error('OneDrive '+r.status);return r.json()},
  async load(){
    const r=await graph(odPath(FILE));
    if(r.status===404){this.etag=null;this.lastText=null;return null}
    if(!r.ok)throw new Error('OneDrive '+r.status+': '+(await r.text()).slice(0,200));
    const m=await r.json(),d=await fetch(m['@microsoft.graph.downloadUrl'],{cache:'no-store'});
    if(!d.ok)throw new Error('Download '+d.status);
    const txt=await d.text();this.etag=m.eTag;this.lastText=txt;return txt;
  },
  async save(txt){
    const h={'Content-Type':'application/json'};if(this.etag)h['If-Match']=this.etag;
    const r=await graph(odPath(FILE)+':/content',{method:'PUT',headers:h,body:txt});
    if(r.status===412||r.status===409)throw Object.assign(new Error('Konflikt'),{konflikt:true});
    if(!r.ok)throw new Error('OneDrive '+r.status+': '+(await r.text()).slice(0,200));
    this.etag=(await r.json()).eTag;
  },
  async backup(old,tag){
    const p=`backup/erp-daten_${tag}.json`,r=await graph(odPath(p)+'?$select=id');
    if(r.status===404)await graph(odPath(p)+':/content',{method:'PUT',headers:{'Content-Type':'application/json'},body:old});
  },
  async putFile(path,blob){
    const r=await graph(odPath(path)+':/content',{method:'PUT',headers:{'Content-Type':blob.type||'application/octet-stream'},body:blob});
    if(!r.ok)throw new Error('Upload '+r.status);
    const m=await r.json();return{name:m.name,path,id:m.id,url:m.webUrl};
  },
  async openFile(a){
    if(a.url){window.open(a.url,'_blank');return}
    const r=await graph(odPath(a.path)+'?$select=webUrl');if(r.ok)window.open((await r.json()).webUrl,'_blank');
  }
};
const DIRSTORE={
  art:'dir',h:null,lastText:null,
  get name(){return'Ordner „'+this.h.name+'“ (nur dieser PC)'},
  async load(){try{const t=await (await (await this.h.getFileHandle(FILE)).getFile()).text();this.lastText=t;return t}catch(e){if(e.name==='NotFoundError')return null;throw e}},
  async save(txt){const w=await (await this.h.getFileHandle(FILE,{create:true})).createWritable();await w.write(txt);await w.close()},

  async dir(parts,create){let d=this.h;for(const p of parts)d=await d.getDirectoryHandle(p,{create});return d},
  async putFile(path,blob){const parts=path.split('/'),fn=parts.pop(),d=await this.dir(parts,true);const w=await (await d.getFileHandle(fn,{create:true})).createWritable();await w.write(blob);await w.close();return{name:fn,path,id:'',url:''}},
  async openFile(a){const parts=a.path.split('/'),fn=parts.pop(),f=await (await (await this.dir(parts,false)).getFileHandle(fn)).getFile();window.open(URL.createObjectURL(f),'_blank')}
};
const CACHESTORE={art:'cache',lastText:null,name:'nur dieser Browser (Test)',async save(){},async backup(){},async putFile(){throw new Error('Anhänge brauchen OneDrive oder einen Datenordner.')},async openFile(){}};
let STORE=CACHESTORE,saving=false,saveAgain=false,retryT=null;

async function saveNow(){
  clearTimeout(saveT);
  if(!DB)return;
  if(saving){saveAgain=true;return}
  saving=true;let txt='';
  try{
    do{
      saveAgain=false;txt=JSON.stringify(DB);
      try{localStorage.setItem('erp-lite-cache',txt)}catch(e){}
      if(STORE.art==='cache'){pending=false;saveState('Nur Browser-Cache – keine Synchronisierung!',true);return}
      const heute=isoD();
      if(lastBackupDay!==heute&&STORE.lastText){try{await STORE.backup(STORE.lastText,heute)}catch(e){}lastBackupDay=heute}
      await STORE.save(txt);STORE.lastText=txt;
    }while(saveAgain);
    pending=false;kvSet('unsynced',null).catch(()=>{});
    saveState('Gespeichert '+new Date().toLocaleTimeString('de-AT',{hour:'2-digit',minute:'2-digit'}));
  }catch(e){
    if(e.konflikt){saving=false;await zusammenfuehren();return}
    kvSet('unsynced',{local:txt||JSON.stringify(DB),base:STORE.lastText,ts:Date.now()}).catch(()=>{});
    if(e.login){saveState('Anmeldung abgelaufen – tippen zum Anmelden',true);loginHinweis()}
    else if(e instanceof TypeError||!navigator.onLine){saveState('Offline – wird später gespeichert',true);clearTimeout(retryT);retryT=setTimeout(saveNow,30000)}
    else{saveState('FEHLER beim Speichern!',true);alert('Speichern fehlgeschlagen:\n'+e.message+'\n\nDie Änderungen bleiben in diesem Browser erhalten und werden beim nächsten Start nachgetragen.')}
  }finally{saving=false}
}

/* Zusammenführen, wenn auf einem anderen Gerät zwischenzeitlich gespeichert wurde (3-Wege-Abgleich je Datensatz) */
function merge3(base,local,remote){
  const eq=(a,b)=>JSON.stringify(a)===JSON.stringify(b),konfl=[],out=remote;
  for(const c of ['kontakte','artikel','belege','lager','zeiten','kalk','lv','lvbib']){
    out[c]=out[c]||[];
    const B=new Map((base?.[c]||[]).map(x=>[x.id,x])),R=new Map(out[c].map(x=>[x.id,x]));
    for(const l of local[c]||[]){
      const b=B.get(l.id),r=R.get(l.id);
      if(!b){if(!r)out[c].push(l);continue}
      if(eq(l,b))continue;
      if(!r){out[c].push(l);continue}
      if(eq(r,b))out[c][out[c].indexOf(r)]=l;
      else if(!eq(r,l))konfl.push(c==='belege'?`${T[l.typ]?.bez} ${bNr(l)}`:c==='kontakte'?l.name:c==='artikel'?l.nr:c);
    }
    const L=new Set((local[c]||[]).map(x=>x.id));
    for(const [id,b] of B)if(!L.has(id)&&R.has(id)&&eq(R.get(id),b))out[c].splice(out[c].indexOf(R.get(id)),1);
  }
  const seen=new Set((out.log||[]).map(x=>x.ts+x.aktion));
  out.log=[...(out.log||[]),...(local.log||[]).filter(x=>!seen.has(x.ts+x.aktion))].sort((a,b)=>a.ts.localeCompare(b.ts));
  if(!eq(local.settings,base?.settings)){if(eq(out.settings,base?.settings))out.settings=local.settings;else konfl.push('Einstellungen')}
  for(const t in local.settings.nk){const z=out.settings.nk[t]?.zaehler;if(!z)continue;for(const j in local.settings.nk[t].zaehler)z[j]=Math.max(z[j]||0,local.settings.nk[t].zaehler[j])}
  {const lf=local.fibu,bf=base?.fibu,rf=out.fibu;if(lf){if(!rf)out.fibu=lf;else{const ids=new Map(rf.buchungen.map(x=>[x.id,x]));for(const x of lf.buchungen){const r=ids.get(x.id);if(!r)rf.buchungen.push(x);else if(x.storno&&!r.storno){r.storno=true;r.stornoDatum=x.stornoDatum}}if(!eq(lf.map,bf?.map)&&eq(rf.map,bf?.map))rf.map=lf.map;if(!eq(lf.konten,bf?.konten)&&eq(rf.konten,bf?.konten))rf.konten=lf.konten;if((lf.sperre||'')>(rf.sperre||''))rf.sperre=lf.sperre}}}
  for(const k of ['K','L'])out.settings.knr[k]=Math.max(out.settings.knr[k]||0,local.settings.knr?.[k]||0);
  out.settings.anr=Math.max(out.settings.anr||0,local.settings.anr||0);
  return{db:out,konfl};
}
async function zusammenfuehren(){
  try{
    const base=STORE.lastText?JSON.parse(STORE.lastText):null,txt=await STORE.load();
    if(txt){const{db,konfl}=merge3(base,DB,migrate(JSON.parse(txt)));DB=migrate(db);
      if(konfl.length)alert('Diese Datensätze wurden gleichzeitig auf einem anderen Gerät geändert – es gilt die Version des anderen Geräts:\n\n• '+[...new Set(konfl)].join('\n• '))}
    artDatalist();render();pending=true;await saveNow();
  }catch(e){saveState('Abgleich fehlgeschlagen',true);alert('Abgleich mit OneDrive fehlgeschlagen:\n'+e.message)}
}
/* Beim Zurückkehren zur App (Handy/PC) neuere Daten holen */
async function aktualisieren(){
  if(STORE.art!=='od'||DIRTY||pending||saving||!DB)return;
  const a=document.activeElement;if(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName))return;
  try{const m=await STORE.meta();if(m&&m.eTag!==STORE.etag){const txt=await STORE.load();DB=migrate(JSON.parse(txt));artDatalist();render();saveState('Aktualisiert '+new Date().toLocaleTimeString('de-AT',{hour:'2-digit',minute:'2-digit'}))}}catch(e){}
}

/* Nummernvergabe nur mit aktuellem Stand (lückenlos, keine Doppelvergabe zwischen Geräten) */
async function vorFest(){
  if(STORE.art!=='od')return true;
  if(DIRTY){if(!confirm('Vor dem Festschreiben werden alle Änderungen gespeichert. Fortfahren?'))return false;await commit()}else await saveNow();
  if(pending){alert('Festschreiben ist nur mit Internetverbindung möglich (lückenlose Nummernvergabe).\nDer Beleg bleibt als Entwurf gespeichert.');return false}
  try{const m=await STORE.meta();if(m&&m.eTag!==STORE.etag){await zusammenfuehren();alert('Daten wurden vom anderen Gerät aktualisiert. Bitte erneut festschreiben.');return false}return true}
  catch(e){alert('Festschreiben ist nur mit Internetverbindung möglich.');return false}
}

  if(neu)lsSet('erp-modus','od');
  if(lsGet('erp-modus')==='od'&&AUTH.tok()){try{await odStart();return}catch(e){if(!e.login)alert('OneDrive nicht erreichbar:\n'+e.message)}}

async function odStart(){

    try{const{db,konfl}=merge3(u.base?JSON.parse(u.base):null,migrate(JSON.parse(u.local)),DB);DB=migrate(db);artDatalist();render();
      alert('Offline erfasste Änderungen wurden nachgetragen.'+(konfl.length?'\n\nKonflikte (Version des anderen Geräts gilt):\n• '+[...new Set(konfl)].join('\n• '):''))}catch(e){}

async function verbinde(h){

  }catch(e){alert('Ordner nicht verfügbar: '+e.message);return}
  DIRSTORE.h=h;let txt=null;
  try{txt=await DIRSTORE.load()}catch(e){alert('Datei '+FILE+' konnte nicht gelesen werden:\n'+e.message);return}
  let data=txt?JSON.parse(txt):null;
  if(!data){const c=cacheLaden();data=(c&&c.belege?.length&&confirm('Im Ordner liegt noch keine Datenbank.\nDaten aus dem Browser-Cache übernehmen?\n\n(Abbrechen = neue, leere Datenbank)'))?c:neueDB()}
  STORE=DIRSTORE;lsSet('erp-modus','dir');await kvSet('dir',h);laden(data);pending=true;await saveNow();
}
function laden(d){
  DB=migrate(d);
  $('#start').style.display='none';document.body.classList.add('loaded');

const posGP=p=>isInfo(p)?0:r2((+p.menge||0)*(+p.ep||0)*(1-(+p.rabatt||0)/100));

/* Gruppen: eine Position der Art „G“ eröffnet eine Gruppe bis zur nächsten Gruppe.
   Gruppenpreis (pauschal) ersetzt die Summe der Gruppenpositionen; Kz der Gruppe gilt für alle Positionen. */
function gruppenInfo(b){
  const grp={},sumG={};let g=null;
  for(const p of b.pos){
    if(p.art==='G'){g=p;sumG[p.id]=0;continue}
    if(p.art==='T'||!g)continue;
    grp[p.id]=g;if(!p.kz)sumG[g.id]+=posGP(p);
  }
  for(const k in sumG)sumG[k]=r2(sumG[k]);
  return{grp,sumG};
}
const effKz=(p,gi)=>p.kz||gi.grp[p.id]?.kz||'';
const gruppePreis=(g,gi)=>+g.pauschal>0?r2(+g.pauschal):gi.sumG[g.id]||0;
function summen(b){
  const m={},gi=gruppenInfo(b);let netto=0,opt=0,lohn=0,sonst=0;
  for(const p of b.pos){
    if(p.art==='T')continue;
    if(p.art==='G'){if(+p.pauschal>0){const gp=r2(+p.pauschal);if(p.kz){opt+=gp;continue}netto+=gp;const c=p.steuer||S().stdSteuer;m[c]=(m[c]||0)+gp}continue}
    const g=gi.grp[p.id],gp=posGP(p);
    if(effKz(p,gi)){opt+=gp;continue}
    if(g&&+g.pauschal>0)continue;
    netto+=gp;m[p.steuer]=(m[p.steuer]||0)+gp;
    const f=(+p.menge||0)*(1-(+p.rabatt||0)/100);lohn+=f*(+p.epL||0);sonst+=f*(+p.epS||0);
  }
  const steuern=Object.keys(m).map(code=>{const d=steuerDef(code),basis=r2(m[code]);return{code,bez:d.bez,satz:+d.satz,basis,betrag:r2(basis*d.satz/100)}});
  netto=r2(netto);const steuer=sum(steuern,x=>x.betrag),brutto=r2(netto+steuer);
  const abz=b.typ==='SR'?(b.fest?(b.abzuege||[]):abzuegeLive(b)):[];
  const steuernEff=steuern.map(t=>{const a=abz.flatMap(x=>x.steuern).filter(x=>x.code===t.code);return{...t,basis:r2(t.basis-sum(a,x=>x.basis)),betrag:r2(t.betrag-sum(a,x=>x.betrag))}});
  const abzN=sum(abz,x=>x.netto),abzB=sum(abz,x=>x.brutto);
  return{netto,steuern,steuer,brutto,opt:r2(opt),abz,nettoEff:r2(netto-abzN),steuernEff,zahlbar:r2(brutto-abzB),lohn:r2(lohn),sonst:r2(sonst),gi};
}
const korrekturen=b=>DB.belege.filter(x=>x.typ==='GS'&&x.vorgaengerId===b.id&&x.fest&&!x.storno);
const bezahlt=b=>sum(b.zahlungen||[],z=>(+z.betrag||0)+(+z.skonto||0));
const faellig=b=>addDays(b.datum,b.zahlungsziel||0);
function offen(b){
  if(!T[b.typ].re||!b.fest)return 0;
  if(b.storno)return r2(-bezahlt(b)); // bereits bezahlte, stornierte Rechnung = Guthaben/Rückzahlung
  if(b.typ==='GS'){const v=beleg(b.vorgaengerId);if(v&&T[v.typ].re)return 0;return r2(-summen(b).brutto+bezahlt(b))}
  return r2(summen(b).zahlbar-sum(korrekturen(b),g=>summen(g).brutto)-bezahlt(b));
}
function zaehltUmsatz(b){return RE_V.includes(b.typ)&&b.fest&&!b.storno&&!(b.typ==='GS'&&b.stornoVon)}
function kinderMenge(posId,typen){let m=0;for(const b of DB.belege){if(b.storno||!typen.includes(b.typ))continue;for(const p of b.pos)if(p.herkunftPosId===posId)m+=(+p.menge||0)}return m}
function erledigung(b){
  const cat=b.typ==='BE'?['WE']:['LS'],cat2=b.typ==='BE'?['ER']:['RE','TR','SR'];
  let soll=0,ist=0;
  for(const p of b.pos){if(isInfo(p)||p.kz)continue;const m=+p.menge||0;soll+=m;ist+=Math.min(m,Math.max(kinderMenge(p.id,cat),kinderMenge(p.id,cat2)))}
  return soll?ist/soll:0;

function statusTag(b){

  if(b.typ==='GS'&&beleg(b.vorgaengerId)&&T[beleg(b.vorgaengerId).typ].re)return tag('verrechnet','ok');
  if(T[b.typ].re){const o=offen(b);if(Math.abs(o)<0.005)return tag('bezahlt','ok');return faellig(b)<isoD()?tag('überfällig','err'):tag('offen','acc')}
  if(['AB','BE'].includes(b.typ)){const e=erledigung(b);return e>=0.9999?tag('erledigt','ok'):e>0?tag('teilweise','warn'):tag('offen','acc')}

function vorkalk(b){
  const s=summen(b);let mat=0,eig=0;

  const mgk=r2(mat*S().mgz/100),hk=r2(mat+eig+mgk),u=s.netto,uS=r2(u*(1-(+b.skonto||0)/100)),z=S().zielDB2/100;
  return{u,uS,mat:r2(mat),eig:r2(eig),mgk,hk,db2:r2(uS-hk),db2p:uS?(uS-hk)/uS:NaN,aufschlag:hk?(uS-hk)/hk:NaN,fehl:Math.max(0,r2(hk/(1-z)-uS))};

function nachkalk(aid){

function bestand(artId,ohneId){let m=0,w=0;for(const e of DB.lager)if(e.artikelId===artId&&e.id!==ohneId){m+=e.menge;w+=e.wert}return{menge:r3(m),wert:r2(w)}}

function lagerBuchung({artikelId,menge,preis=null,datum,belegId='',posId='',text=''}){

function posIndex(){const m={};for(const b of DB.belege)for(const p of b.pos)m[p.id]={p,b};return m}

/* ---------- Festschreiben / Storno ---------- */
function adressSnapshot(k){return k?{nr:k.nr,name:k.name,zusatz:k.zusatz,strasse:k.strasse,plz:k.plz,ort:k.ort,land:k.land,uid:k.uid}:{}}

      ${OHNE_PREIS.includes(b.typ)?'':`<tr><td>Betrag brutto</td><td><b>${fmt(s.zahlbar)} €</b></td></tr>`}</table>
      ${warn.length?`<div class="hint"><b>Hinweise:</b><br>• ${warn.map(esc).join('<br>• ')}</div>`:''}
      ${fix?`<div class="mwarn">Nach dem Festschreiben kann dieser Beleg <b>nicht mehr geändert oder gelöscht</b> werden. Korrekturen sind nur noch über ${t.b==='V'&&t.re?'eine Gutschrift / Storno':'Storno'} möglich (§ 11 UStG, § 131 BAO).</div>`
        :`<div class="hint">Die Nummer bleibt fix. Der Inhalt kann später über „Bearbeiten“ noch geändert werden.</div>`}`,

function stornieren(b){

/* ---------- Preisvorschläge ---------- */
function preisHistorie(b,p){
  const typen=T[b.typ].b==='V'?['AN','AB','PR','RE','TR','SR']:['BE','WE','ER'];
  const key=(p.bez||'').trim().toLowerCase();
  if(!p.artikelId&&!key)return[];
  const out=[];
  for(const x of DB.belege){
    if(x===b||x.storno||!typen.includes(x.typ))continue;
    for(const q of x.pos){
      if(isInfo(q))continue;
      if(p.artikelId?q.artikelId!==p.artikelId:(q.bez||'').trim().toLowerCase()!==key)continue;
      out.push({datum:x.datum,nr:bNr(x),typ:x.typ,kontaktId:x.kontaktId,menge:q.menge,einheit:q.einheit,ep:+q.ep,rabatt:+q.rabatt||0,ek:+q.ek||0,gleich:x.kontaktId===b.kontaktId});
    }
  }
  out.sort((a,c)=>(c.gleich-a.gleich)||c.datum.localeCompare(a.datum));
  return out.slice(0,15);
}
function artikelInPos(b,p,a){
  Object.assign(p,{artikelId:a.id,nr:a.nr,bez:a.bez,text:a.text||'',einheit:a.einheit,faktor:1,steuer:a.steuer||S().stdSteuer,art:a.art||'W'});
  const h=preisHistorie(b,p).filter(x=>x.einheit===p.einheit);
  if(T[b.typ].b==='V'){p.ek=+a.ek||0;p.ep=h.length?h[0].ep:(+a.vk||0);p.rabatt=h.length?h[0].rabatt:0}
  else{p.ep=h.length?h[0].ep:(+a.ek||0);p.ek=p.ep;const l=(a.lieferanten||[]).find(x=>x.kontaktId===b.kontaktId);if(l?.artNr)p.text=(p.text?p.text+'\n':'')+'Ihre Art.-Nr.: '+l.artNr}
}

function edUebernehmen(el,next){
  const b=curBeleg();if(!b||b.fest)return;
  const[t,a,f]=el.dataset.ed.split(':'),rich=(t==='h'&&['kopf','fuss'].includes(a))||(t==='p'&&f==='text');
  const txt=rich?clean(el.innerHTML):el.innerText.replace(/\u00a0/g,' ').replace(/\n+$/,'');
  let val;
  if(t==='h'){if(b[a]===txt)return;b[a]=val=txt;const i=document.querySelector(`[data-h="${a}"]`);if(i)i.value=txt}
  else{
    const p=b.pos[+a];if(!p)return;
    const v=['menge','ep','rabatt','epL','epS'].includes(f)?deNum(txt):txt;
    if(p[f]===v)return;p[f]=val=v;
    if(f==='epL'||f==='epS'){p.ep=r2((+p.epL||0)+(+p.epS||0));const e=document.querySelector(`[data-p="${a}"][data-f="ep"]`);if(e)e.value=p.ep}
    const i=document.querySelector(`[data-p="${a}"][data-f="${f}"]`);if(i)i.value=v;
  }
  document.querySelectorAll(`[data-ed="${el.dataset.ed}"]`).forEach(o=>{if(o!==el)o.innerHTML=rich?rt(val):esc(val)});
  persist();
  const key=next?.dataset?.ed;
  updateCalc(b);
  if(key){const n=document.querySelector(`#vorschau [data-ed="${key}"]`);if(n){n.focus();const r=document.createRange();r.selectNodeContents(n);r.collapse(false);const s=getSelection();s.removeAllRanges();s.addRange(r)}}
}

document.addEventListener('keydown',e=>{const el=e.target.closest?.('[data-ed]');if(el&&e.key==='Enter'&&!el.classList.contains('ml')&&!el.classList.contains('rte')){e.preventDefault();el.blur()}});

function zeitenAbrechnen(aid){
  const zt=DB.zeiten.filter(z=>z.auftragId===aid&&!z.belegId);if(!zt.length)return;
  const root=beleg(aid)||DB.belege.find(b=>b.auftragId===aid);
  const b=neuBeleg('RE',{kontaktId:root.kontaktId,auftragId:aid,betreff:root.betreff,vorgaengerId:'',zahlungsziel:kontakt(root.kontaktId)?.zahlungsziel??S().zahlungsziel});
  zeitenInPos(b,zt);
  const ds=zt.map(z=>z.datum).sort();b.leistung=ds[0]===ds[ds.length-1]?dAT(ds[0]):`${dAT(ds[0])} – ${dAT(ds[ds.length-1])}`;
  persist();go('beleg/'+b.id);
}
function zeitenInPos(b,zt){
  for(const z of zt.sort((a,c)=>a.datum.localeCompare(c.datum))){
    const tf=S().tarife.find(t=>t.kz===z.tarif);
    b.pos.push(neuPos({art:'L',nr:z.tarif,bez:tf?.bez||z.tarif,text:`${dAT(z.datum)}${z.text?' – '+z.text:''}`,menge:z.stunden,einheit:'h',ep:z.vk,ek:z.kosten}));
    z.belegId=b.id;
  }
}

/* ---------- Auswertungen ---------- */
function ustVerteilung(b){
  // Liefert [{datum,faktor}] – Soll: Rechnungsdatum; Ist und Anzahlungen: Zahlungsdatum
  const ist=S().besteuerung==='ist'||b.typ==='AR';
  if(!ist||b.typ==='ER')return[{datum:b.datum,f:1}];
  const z=summen(b).zahlbar;if(!z)return[{datum:b.datum,f:1}];
  return(b.zahlungen||[]).map(x=>({datum:x.datum,f:((+x.betrag||0)+(+x.skonto||0))/z}));
}
V.auswertung=()=>{
  const j=UI.jahr,jahre=[...new Set([String(new Date().getFullYear()),...DB.belege.map(b=>b.datum.slice(0,4))])].sort().reverse();
  const reV=DB.belege.filter(zaehltUmsatz);
  const reJ=reV.filter(b=>b.datum.startsWith(j));
  const er=DB.belege.filter(b=>b.typ==='ER'&&b.fest&&!b.storno);
  const M=Array.from({length:12},(_,i)=>({m:i+1,u:0,ust:{},vst:0,ein:0,aus:0}));
  for(const b of reJ)M[+b.datum.slice(5,7)-1].u+=sgn(b)*summen(b).nettoEff;
  for(const b of reV)for(const v of ustVerteilung(b)){if(!v.datum.startsWith(j))continue;const m=M[+v.datum.slice(5,7)-1];for(const t of summen(b).steuernEff){m.ust[t.code]=(m.ust[t.code]||0)+sgn(b)*t.betrag*v.f;m.ust['B'+t.code]=(m.ust['B'+t.code]||0)+sgn(b)*t.basis*v.f}}
  for(const b of er)if(b.datum.startsWith(j))M[+b.datum.slice(5,7)-1].vst+=summen(b).steuer;
  for(const b of DB.belege.filter(b=>T[b.typ].re&&b.fest))for(const z of b.zahlungen||[])if(z.datum.startsWith(j)){const m=M[+z.datum.slice(5,7)-1];if(T[b.typ].b==='V')m.ein+=sgn(b)*z.betrag;else m.aus+=z.betrag}
  const codes=S().steuer.map(s=>s.code).filter(c=>M.some(m=>m.ust[c]||m.ust['B'+c]));
  const kunden={},artk={};
  for(const b of reJ){const s=sgn(b);kunden[b.kontaktId]=(kunden[b.kontaktId]||0)+s*summen(b).nettoEff;for(const p of b.pos){if(isInfo(p)||p.kz)continue;const key=p.artikelId?(artikel(p.artikelId)?.nr+' '+artikel(p.artikelId)?.bez):p.bez;artk[key]=artk[key]||{m:0,u:0,e:p.einheit};artk[key].m+=s*p.menge;artk[key].u+=s*posGP(p)}}
  const an=DB.belege.filter(b=>b.typ==='AN'&&b.fest&&!b.storno&&b.status!=='ersetzt'&&b.datum.startsWith(j));
  const anA=an.filter(b=>b.status==='angenommen'),anX=an.filter(b=>b.status==='abgelehnt');
  const deb=DB.belege.filter(b=>T[b.typ].re&&T[b.typ].b==='V'&&Math.abs(offen(b))>0.005).sort((a,c)=>faellig(a).localeCompare(faellig(c)));
  const kred=er.filter(b=>Math.abs(offen(b))>0.005).sort((a,c)=>faellig(a).localeCompare(faellig(c)));
  const heute=isoD();
  const opT=L=>`<table><thead><tr><th>Beleg</th><th>Partner</th><th>fällig</th><th class="n">offen</th></tr></thead><tbody>${L.map(b=>`<tr class="click" onclick="nav('beleg/${b.id}')"><td>${esc(b.nr)}${b.fremdNr?' / '+esc(b.fremdNr):''}</td><td>${esc(kName(b.kontaktId))}</td><td class="${faellig(b)<heute?'err':''}">${dAT(faellig(b))}</td><td class="n">${fmt(offen(b))}</td></tr>`).join('')||'<tr><td colspan="4" class="mut">keine</td></tr>'}</tbody><tfoot><tr><td colspan="3">Summe</td><td class="n">${fmt(sum(L,offen))}</td></tr></tfoot></table>`;
  const mn=['Jän','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];
  const aufJ=auftragsListe().filter(a=>a.docs.some(d=>zaehltUmsatz(d)&&d.datum.startsWith(j))).map(a=>({a,n:nachkalk(a.id)}));
  return`<div class="bar"><h1 style="margin:0">Auswertungen</h1><select data-o="ui" data-f="jahr">${jahre.map(x=>opt(x,x,j)).join('')}</select></div>
  <div class="grid">
    <div class="kpi">Umsatz netto<b>${fmt(sum(M,m=>m.u))} €</b></div>
    <div class="kpi">DB II Aufträge<b>${fmt(sum(aufJ,x=>x.n.db2))} € ${dbTag(sum(aufJ,x=>x.n.db2)/sum(aufJ,x=>x.n.uN))}</b></div>
    <div class="kpi">Angebote<b>${an.length} · ${fmt(sum(an,b=>summen(b).netto))} €</b><span class="mut">Trefferquote ${an.length?pct(anA.length/an.length):'–'} (${anA.length} angenommen, ${anX.length} abgelehnt)</span></div>
    <div class="kpi">Lagerwert aktuell<b>${fmt(sum(DB.artikel.filter(a=>a.lager),a=>bestand(a.id).wert))} €</b></div>
  </div>

/* --- Rechenwerk --- */
function k2gz(kb){const z=kb?.k2?.zeilen||[];return{l:z.reduce((a,x)=>a+(+x.l||0),0),s:z.reduce((a,x)=>a+(+x.s||0),0)}}
const imHundert=p=>p/(100+p)*100;
function k3calc(kb,c){
  const arb=c.arbeiter||[],n=arb.reduce((a,x)=>a+(+x.anz||0),0);
  const kv=n?arb.reduce((a,x)=>a+(+x.anz||0)*(+x.lohn||0),0)/n:0;
  let auf=0;for(const a of c.aufz||[])auf+=a.art==='%'?kv*(+a.wert||0)/100:(+a.wert||0);
  const ml=kv+auf,lnkP=(c.lnk||[]).reduce((a,x)=>a+(+x.pct||0),0),lnk=ml*lnkP/100,so=(c.sonst||[]).reduce((a,x)=>a+(+x.eur||0),0);
  const mlk=ml+lnk+so,pgkP=(c.pgk||[]).reduce((a,x)=>a+(+x.pct||0),0),pgk=mlk*pgkP/100,lk=mlk+pgk,gz=k2gz(kb).l,mlpR=lk*(1+gz/100);
  const mlp=+c.mlpAngabe>0?+c.mlpAngabe:mlpR;
  return{n,kv,auf,ml,lnkP,lnk,so,mlk,pgkP,pgk,lk,gz,mlpR:r2(mlpR),mlp:r2(mlp),faktor:kv?mlp/kv:NaN};
}
const k3von=(kb,id)=>kb?(kb.k3.find(x=>x.id===id)||kb.k3[0]):null;
const k4kosten=m=>(+m.lp||0)*(1-(+m.rab||0)/100)*(1+(+m.bezug||0)/100)*(1+(+m.verlust||0)/100);
const k6kosten=g=>(+g.av||0)+(+g.rep||0)+(+g.betrieb||0);
// Teile (K5-Komponenten bzw. K7-Zeilen): L = Lohnstunden, M = Material (K4), G = Gerät (K6), F = Fremdleistung, K5 = zusammengesetzte Komponente
function teileCalc(kb,teile,tiefe=0){
  let std=0,sk=0;
  for(const t of teile||[]){
    const m=+t.menge||0;
    if(t.typ==='L'){std+=m;continue}
    if(t.typ==='K5'){const k5=kb?.k5.find(x=>x.id===t.ref);if(k5&&tiefe<4){const r=teileCalc(kb,k5.teile,tiefe+1);std+=m*r.std;sk+=m*r.sk}continue}
    let k=+t.kosten||0;
    if(t.typ==='M'&&t.ref){const x=kb?.k4.find(y=>y.id===t.ref);if(x)k=k4kosten(x)}
    if(t.typ==='G'&&t.ref){const x=kb?.k6.find(y=>y.id===t.ref);if(x)k=k6kosten(x)}
    sk+=m*k;
  }
  return{std,sk};
}
function k7calc(kb,p){
  const c=p.k7||{},r=teileCalc(kb,c.teile),std=(+c.zeit||0)+r.std,k3=k3von(kb,c.k3Id),x=k3?k3calc(kb,k3):{mlp:0,lk:0},gzS=k2gz(kb).s;
  const epL=r2(std*x.mlp),epS=r2(r.sk*(1+gzS/100));
  return{std,mlp:x.mlp,lk:x.lk,sk:r.sk,gzS,epL,epS,ep:r2(epL+epS),kosten:std*x.lk+r.sk};
}
function lvKB(lv){return DB.kalk.find(x=>x.id===lv.kbId)||null}
function posPreis(lv,p){
  if(p.modus==='k7'){const kb=lvKB(lv);if(kb){const k=k7calc(kb,p);return{l:k.epL,s:k.epS,ep:k.ep,kosten:k.kosten,k7:k}}}
  const l=r2(+p.epL||0),s=r2(+p.epS||0);return{l,s,ep:r2(l+s),kosten:+p.kosten||0};
}
function lvOZ(lv){const m={},hatLB=lv.items.some(i=>i.lb);let lg=0,ug=0,ps=0,LG='00',UG='00';for(const it of lv.items){if(it.typ==='LG'){lg++;ug=0;ps=0;LG=it.nr||pad2(lg);m[it.id]=LG}else if(it.typ==='ULG'){ug++;ps=0;UG=it.nr||pad2(ug);m[it.id]=`${LG}.${UG}`}else if(it.lb){m[it.id]=`${LG}.${UG}.${it.lb.gt}${it.lb.ft}`}else{ps++;m[it.id]=`${LG}.${UG}.${pad2(ps)}${hatLB?'Z':''}`}}return m}
function lvSummen(lv,pf=p=>posPreis(lv,p).ep){
  const s={gesamt:0,lg:{},ulg:{}};let cl=null,cu=null;
  for(const it of lv.items){

    if(it.typ==='ULG'){cu=it.id;s.ulg[cu]=0;continue}
    if(it.art)continue;
    const gp=r2((+it.menge||0)*(pf(it)||0));s.gesamt+=gp;if(cl)s.lg[cl]+=gp;if(cu)s.ulg[cu]+=gp;
  }
  s.gesamt=r2(s.gesamt);return s;
}

      return`<div class="card"><div class="row"><label class="w2">Komponente${fi(R,P+'.bez',c.bez)}</label><label class="w05">Einheit${fsel(R,P+'.einheit',c.einheit,S().einheiten.map(e=>[e,e]))}</label><button class="s d" data-act="arrdel" data-r="${R}" data-f="k5" data-i="${ci}">Löschen</button></div>
      ${teileTab(kb,R,P+'.teile',c.teile,true)}
      <p style="margin:6px 0 0"><b>Je ${esc(c.einheit)}:</b> ${fmtQ(r.std)} h Lohn (${fmt(r.std*x.mlp)} €) · Sonstiges Kosten ${fmt(r.sk)} € → Preis ${fmt(r.sk*(1+g.s/100))} €</p></div>`}).join('')+arrBtn('k5','k5','+ Komponente');
  }
  if(tab==='VGL'){
    const andere=DB.kalk.filter(x=>x.id!==kb.id),ref=DB.kalk.find(x=>x.id===UI.kbVgl)||andere[0];
    if(!ref)body='<p class="mut">Für einen Vergleich wird eine zweite Kalkulationsbasis benötigt (z. B. eigene Werte oder anderer Bieter).</p>';
    else{
      const a=kb.k3[0]?k3calc(kb,kb.k3[0]):null,b=ref.k3[0]?k3calc(ref,ref.k3[0]):null,ga=k2gz(kb),gb=k2gz(ref),gr=S().abwGrenze/100;
      const z=(l,va,vb,f=fmt)=>{const d=vb?(va-vb)/vb:NaN,flag=isFinite(d)&&Math.abs(d)>gr;return`<tr><td>${l}</td><td class="n">${f(va)}</td><td class="n">${f(vb)}</td><td class="n ${flag?'err':''}">${isFinite(d)?pct(d):'–'}${flag?' ⚠':''}</td></tr>`};
      body=`<div class="bar">Vergleich mit <select data-o="ui" data-f="kbVgl">${andere.map(x=>opt(x.id,x.name,ref.id)).join('')}</select><span class="mut">Markierung bei Abweichung über ${fmtQ(S().abwGrenze)} % (Einstellungen)</span></div>
      <table class="k"><thead><tr><th>Kennwert</th><th class="n">${esc(kb.name)}</th><th class="n">${esc(ref.name)}</th><th class="n">Abweichung</th></tr></thead><tbody>
      ${z('Gesamtzuschlag Lohn %',ga.l,gb.l)}${z('Gesamtzuschlag Sonstiges %',ga.s,gb.s)}
      ${kb.k2.zeilen.map(r=>{const o=ref.k2.zeilen.find(x=>x.bez===r.bez);return o?z(' · '+esc(r.bez)+' (Lohn)',+r.l,+o.l)+z(' · '+esc(r.bez)+' (Sonst.)',+r.s,+o.s):''}).join('')}
      ${a&&b?z('Gewichteter KV-Lohn €/h',a.kv,b.kv)+z('Mittellohn €/h',a.ml,b.ml)+z('Lohnnebenkosten %',a.lnkP,b.lnkP)+z('Mittellohnkosten €/h',a.mlk,b.mlk)+z('Personalgemeinkosten %',a.pgkP,b.pgkP)+z('Mittellohnpreis €/h',a.mlp,b.mlp)+z('Faktor Preis / KV-Lohn',a.faktor,b.faktor,v=>isFinite(v)?fmtQ(v):'–'):''}
      </tbody></table>`;
    }
  }
  const tabs=[['K2','K2 Gesamtzuschlag'],['K3','K3 Personalpreis'],['K4','K4 Material'],['K5','K5 Komponenten'],['K6','K6 Geräte'],['VGL','Vergleich / Prüfung']];
  return`<div class="bar"><h1 style="margin:0">${esc(kb.name)}</h1>${kb.art==='bieter'?tag('Prüfung Bieter','warn'):''}<span class="sp"></span>
    <button data-act="kbdruck" data-id="${kb.id}">PDF / Drucken</button><button data-act="kbdup" data-id="${kb.id}">Kopie (neues Jahr)</button><button class="d" data-act="kbdel" data-id="${kb.id}">Löschen</button></div>
  <div class="card"><div class="row"><label class="w2">Bezeichnung${fi(R,'name',kb.name)}</label>${kb.art==='bieter'?`<label>Bieter${fi(R,'bieter',kb.bieter)}</label>`:''}<label>Projekt / Gültigkeit${fi(R,'projekt',kb.projekt)}</label></div>
  <div class="row"><label>Notiz / Prüfvermerk${ft(R,'notiz',kb.notiz)}</label></div></div>
  <div class="bar"><span class="seg">${tabs.map(([k,l])=>`<button class="${tab===k?'on':''}" data-act="kbtab" data-t="${k}">${l}</button>`).join('')}</span></div>
  <div class="card" style="overflow-x:auto">${body}</div>
  <p class="mut" style="font-size:12px">Aufbau nach dem Grundschema der ÖNORM B 2061. Zeilen und Bezeichnungen bitte mit der gültigen Normfassung und dem aktuellen Kollektivvertrag abgleichen.</p>`;
}
function teileTab(kb,R,f,teile,mitK5){
  const k4=kb?.k4||[],k6=kb?.k6||[],k5=kb?.k5||[],gzS=k2gz(kb).s;
  const typen=[['L','Lohn (h)'],['M','Material (K4)'],['G','Gerät (K6)'],['F','Fremdleistung'],...(mitK5?[]:[['K5','Komponente (K5)']])];
  return`<table class="k"><thead><tr><th>Art</th><th>Bezug / Bezeichnung</th><th class="n">Menge</th><th class="n">Kosten/Einh.</th><th class="n">Kosten</th><th></th></tr></thead><tbody>
  ${(teile||[]).map((t,i)=>{const P=`${f}.${i}`;let refSel='',k=+t.kosten||0,eig=true;
    if(t.typ==='M'){refSel=fsel(R,P+'.ref',t.ref,[['','– frei –'],...k4.map(x=>[x.id,x.bez])]);const x=k4.find(y=>y.id===t.ref);if(x){k=k4kosten(x);eig=false}}
    if(t.typ==='G'){refSel=fsel(R,P+'.ref',t.ref,[['','– frei –'],...k6.map(x=>[x.id,x.bez])]);const x=k6.find(y=>y.id===t.ref);if(x){k=k6kosten(x);eig=false}}
    if(t.typ==='K5'){refSel=fsel(R,P+'.ref',t.ref,[['','– wählen –'],...k5.map(x=>[x.id,x.bez])]);eig=false}
    const r=t.typ==='L'||t.typ==='K5'?null:k*(+t.menge||0);
    return`<tr><td>${fsel(R,P+'.typ',t.typ,typen,'140px')}</td><td>${refSel}${eig||t.typ==='L'?fi(R,P+'.bez',t.bez,{ph:'Bezeichnung'}):''}</td><td>${fi(R,P+'.menge',t.menge,{n:1,w:'85px'})}</td>
      <td class="n">${t.typ==='L'?'<span class="mut">h</span>':t.typ==='K5'?'':eig?fi(R,P+'.kosten',t.kosten,{n:1,w:'95px'}):fmt(k)}</td><td class="n">${r==null?'':fmt(r)}</td><td><button class="s d" data-act="arrdel" data-r="${R}" data-f="${f}" data-i="${i}">✕</button></td></tr>`}).join('')}
  </tbody></table><button class="s" data-act="arradd" data-r="${R}" data-f="${f}" data-tpl="teil">+ Zeile</button>`;
}

/* --- Textbausteine --- */
V.lvbib=()=>{
  const q=(UI.bQ||'').toLowerCase(),L=DB.lvbib.filter(b=>!q||(b.kurz+' '+b.lang+' '+b.gruppe).toLowerCase().includes(q));
  return`<div class="bar"><h1 style="margin:0">Textbausteine (Positionen)</h1><input data-o="ui" data-f="bQ" value="${esc(UI.bQ||'')}" placeholder="Suche" style="width:240px"><span class="sp"></span><button class="p" data-act="bibneu">+ Baustein</button></div>
  ${L.map(b=>{const R='bib|'+b.id;return`<div class="card"><div class="row"><label class="w05">Gruppe${fi(R,'gruppe',b.gruppe,{ph:'z. B. Kabel'})}</label><label class="w2">Kurztext${fi(R,'kurz',b.kurz)}</label><label class="w05">Einheit${fsel(R,'einheit',b.einheit,S().einheiten.map(e=>[e,e]))}</label><button class="s d" data-act="bibdel" data-id="${b.id}">Löschen</button></div>
  <div class="row"><label>Langtext${ft(R,'lang',b.lang)}</label></div>${b.k7?`<p class="mut" style="margin:0;font-size:12px">mit K7-Vorlage: ${fmtQ(b.k7.zeit)} h + ${(b.k7.teile||[]).length} Zeilen</p>`:''}</div>`}).join('')||'<p class="mut">Keine Bausteine. Positionen im LV mit „→ Baustein“ speichern oder hier anlegen.</p>'}`;
};

/* --- Leistungsverzeichnisse --- */
V.lvs=id=>{
  if(id)return lvEdit(id);
  return`<div class="bar"><h1 style="margin:0">Leistungsverzeichnisse</h1><span class="sp"></span><button class="p" data-act="lvneu" data-a="angebot">+ LV für Angebot</button><button data-act="lvneu" data-a="ausschreibung">+ LV für Ausschreibung</button></div>
  <div class="card" style="padding:0"><table><thead><tr><th>Nr</th><th>Titel</th><th>Art</th><th>Auftraggeber</th><th class="n">Positionen</th><th class="n">Summe netto</th><th class="n">Bieter</th></tr></thead><tbody>
  ${DB.lv.map(lv=>`<tr class="click" onclick="nav('lvs/${lv.id}')"><td>${esc(lv.nr)}</td><td>${esc(lv.titel)}</td><td>${lv.art==='ausschreibung'?tag('Ausschreibung','warn'):tag('Angebot','acc')}</td><td>${esc(kName(lv.kontaktId))}</td><td class="n">${lv.items.filter(i=>i.typ==='POS').length}</td><td class="n">${fmt(lvSummen(lv).gesamt)}</td><td class="n">${lv.bieter.length||''}</td></tr>`).join('')||'<tr><td colspan="7" class="mut">Noch keine LVs.</td></tr>'}
  </tbody></table></div>`;
};
function lvEdit(id){
  const lv=ROOT.lv(id);if(!lv)return'<p>Nicht gefunden.</p>';
  const R='lv|'+lv.id,oz=lvOZ(lv),kb=lvKB(lv),tab=UI.lvTab||'lv',sm=lvSummen(lv),aus=lv.art==='ausschreibung';
  const kunden=DB.kontakte.filter(k=>k.typ!=='L');
  let body='';
  if(tab==='lv'){
    body=lv.items.map((it,i)=>{
      const P=`items.${i}`,act=`<span class="lvact"><button class="s" data-act="lvmv" data-id="${lv.id}" data-i="${i}" data-d="-1">↑</button><button class="s" data-act="lvmv" data-id="${lv.id}" data-i="${i}" data-d="1">↓</button>${it.typ==='POS'?`<button class="s" data-act="lvbib" data-id="${lv.id}" data-i="${i}" title="als Textbaustein speichern">→ Baustein</button>`:''}<button class="s d" data-act="lvdel" data-id="${lv.id}" data-i="${i}">✕</button></span>`;
      if(it.typ!=='POS')return`<div class="lv-${it.typ}"><div class="row" style="margin:0"><b class="oz">${oz[it.id]}</b><label class="w2">${it.typ==='LG'?'Leistungsgruppe':'Unterleistungsgruppe'}${fi(R,P+'.titel',it.titel)}</label><span class="n" style="align-self:center">${fmt(it.typ==='LG'?sm.lg[it.id]:sm.ulg[it.id])}</span>${act}</div>
        <details ${it.vorb?'open':''}><summary class="mut">Vorbemerkung</summary>${ft(R,P+'.vorb',it.vorb)}</details></div>`;
      const pr=posPreis(lv,it),gp=r2((+it.menge||0)*pr.ep),offen=UI.lvOffen===it.id;
      return`<div class="lv-POS ${it.art?'lv-ew':''}"><div class="row" style="margin:0">
        <b class="oz">${oz[it.id]}${it.art?' '+it.art:''}</b>
        <label class="w2">${it.lb?'Stichwort (Standard-LB)':'Kurztext'}${fi(R,P+'.kurz',it.kurz,{dis:!!it.lb})}</label>
        <label class="w05">Menge${fi(R,P+'.menge',it.menge,{n:1})}</label>
        <label class="w05">Einh.${fsel(R,P+'.einheit',it.einheit,S().einheiten.map(e=>[e,e]))}</label>
        <label class="w05">Art${fsel(R,P+'.art',it.art,Object.entries(POSART))}</label>
        ${aus&&!lv.schaetzung?'':`<label class="w05">EP Lohn${it.modus==='k7'?`<input disabled value="${fmt(pr.l)}">`:fi(R,P+'.epL',it.epL,{n:1})}</label><label class="w05">EP Sonst.${it.modus==='k7'?`<input disabled value="${fmt(pr.s)}">`:fi(R,P+'.epS',it.epS,{n:1})}</label>
        <label class="w05">GP<input disabled value="${fmt(gp)}${it.art?' (n. i. S.)':''}"></label>`}
        ${act}</div>
        ${it.lb?lbPosEditor(lv,it,P):`<details><summary class="mut">Langtext${it.lang?': '+esc(rtText(it.lang).slice(0,90))+(it.lang.length>90?' …':''):''}</summary>${ft(R,P+'.lang',it.lang)}</details>`}
        ${aus&&!lv.schaetzung?'':`<div class="k7bar"><button class="s ${offen?'p':''}" data-act="lvk7" data-p="${it.id}">K7 ${it.modus==='k7'?`✓ ${fmtQ(pr.k7?.std||0)} h`:'(manuell)'}</button>${pr.kosten?`<span class="mut">Kosten ${fmt(pr.kosten)} · DB ${pct(pr.ep?(pr.ep-pr.kosten)/pr.ep:NaN)}</span>`:''}</div>
        ${offen?k7Editor(lv,it,P):''}`}
      </div>`;
    }).join('')+`<div class="bar" style="margin-top:10px"><button data-act="lvadd" data-id="${lv.id}" data-t="LG">+ Leistungsgruppe</button><button data-act="lvadd" data-id="${lv.id}" data-t="ULG">+ Unterleistungsgruppe</button><button class="p" data-act="lvadd" data-id="${lv.id}" data-t="POS">+ Position</button>
      <button data-act="lvzulb" data-id="${lv.id}">+ aus Standard-LB</button>${DB.lvbib.length?`<select data-act="lvausbib" data-id="${lv.id}">${opt('','+ aus Textbaustein …','')}${DB.lvbib.map(b=>opt(b.id,(b.gruppe?b.gruppe+' · ':'')+b.kurz,'')).join('')}</select>`:''}</div>
      <div class="card" style="margin-top:12px"><dl class="kv"><dt class="tot">${aus?(lv.schaetzung?'Kostenschätzung netto':'Summe'):'Angebotssumme netto'}</dt><dd class="tot">${fmt(sm.gesamt)}</dd>${!aus&&+lv.nachlass?`<dt>abzgl. Nachlass ${fmtQ(lv.nachlass)} %</dt><dd>−${fmt(sm.gesamt*lv.nachlass/100)}</dd><dt class="tot">Summe nach Nachlass</dt><dd class="tot">${fmt(sm.gesamt*(1-lv.nachlass/100))}</dd>`:''}</dl></div>`;
  }
  if(tab==='vorschau')body=`<div class="blatt">${lvDocHTML(lv,!aus||lv.schaetzung?'preise':'leer')}</div>`;
  if(tab==='ps')body=preisspiegel(lv);
  const tabs=[['lv','Positionen'],['vorschau','Vorschau'],['ps',`Preisspiegel${lv.bieter.length?' ('+lv.bieter.length+')':''}`]];
  return`<div class="bar"><h1 style="margin:0">LV ${esc(lv.nr)} ${esc(lv.titel)}</h1>${aus?tag('Ausschreibung','warn'):tag('Angebot','acc')}<span class="sp"></span>
    <select data-act="lvdruck" data-id="${lv.id}">${opt('','PDF / Drucken …','')}${opt('leer','LV ohne Preise (Ausschreibung)','')}${opt('preise','LV mit Preisen (Lohn/Sonstiges)','')}${opt('k7','K7-Blätter je Position','')}${lv.bieter.length?opt('ps','Preisspiegel',''):''}</select>
    ${aus?'':`<button class="p" data-act="lvan" data-id="${lv.id}">→ Angebot erzeugen</button>`}
    <button data-act="lvdup" data-id="${lv.id}">Kopie</button><button class="d" data-act="lvlos" data-id="${lv.id}">Löschen</button></div>
  <div class="card"><div class="row"><label class="w05">LV-Nr.${fi(R,'nr',lv.nr)}</label><label class="w2">Titel / Projekt${fi(R,'titel',lv.titel)}</label>
    <label>Auftraggeber${fsel(R,'kontaktId',lv.kontaktId,[['','–'],...kunden.map(k=>[k.id,k.name])])}</label>
    <label class="w05">Art${fsel(R,'art',lv.art,[['angebot','Angebot (eigene Preise)'],['ausschreibung','Ausschreibung']])}</label></div>
  <div class="row"><label>Kalkulationsbasis (K2–K6)${fsel(R,'kbId',lv.kbId,[['','– keine (Preise manuell) –'],...DB.kalk.filter(k=>k.art==='eigen').map(k=>[k.id,k.name])])}</label>
    ${aus?`<label class="w05">Kostenschätzung<br><input type="checkbox" data-o="path" data-r="${R}" data-f="schaetzung" ${lv.schaetzung?'checked':''}></label>`:`<label class="w05">Nachlass %${fi(R,'nachlass',lv.nachlass,{n:1})}</label>`}
    <label class="w05">Datum<input type="date" data-o="path" data-r="${R}" data-f="datum" value="${esc(lv.datum)}"></label></div>
  <details ${lv.vorb?'open':''}><summary class="mut">Allgemeine Vorbemerkungen</summary>${ft(R,'vorb',lv.vorb)}</details>
  ${!kb&&(!aus||lv.schaetzung)?'<div class="hint" style="margin-top:8px">Ohne Kalkulationsbasis werden EP Lohn/Sonstiges manuell eingegeben. Für K7 eine Basis unter <a href="#/kbs">K-Blätter</a> anlegen und hier wählen.</div>':''}</div>
  <div class="bar"><span class="seg">${tabs.map(([k,l])=>`<button class="${tab===k?'on':''}" data-act="lvtab" data-t="${k}">${l}</button>`).join('')}</span></div>
  ${body}`;
}
function k7Editor(lv,it,P){
  const kb=lvKB(lv),R='lv|'+lv.id;
  if(!kb)return'<div class="hint">Für K7 zuerst oben eine Kalkulationsbasis wählen.</div>';
  it.k7=it.k7||{zeit:0,k3Id:'',teile:[]};
  const k=k7calc(kb,it);
  return`<div class="k7"><div class="row">
    <label class="w05">Preisermittlung${fsel(R,P+'.modus',it.modus||'man',[['man','manuell'],['k7','nach K7']])}</label>
    <label class="w05">Zeitansatz h/${esc(it.einheit)}${fi(R,P+'.k7.zeit',it.k7.zeit,{n:1})}</label>
    <label>Personalpreis (K3)${fsel(R,P+'.k7.k3Id',it.k7.k3Id,kb.k3.map(c=>[c.id,`${c.name} · ${fmt(k3calc(kb,c).mlp)} €/h`]))}</label></div>
    ${teileTab(kb,R,P+'.k7.teile',it.k7.teile,false)}
    <table class="k" style="margin-top:8px"><tr><td>Lohn: ${fmtQ(k.std)} h × ${fmt(k.mlp)} €/h</td><td class="n"><b>EP Lohn ${fmt(k.epL)}</b></td></tr>
    <tr><td>Sonstiges: Kosten ${fmt(k.sk)} + ${fmt(k.gzS)} % Gesamtzuschlag</td><td class="n"><b>EP Sonstiges ${fmt(k.epS)}</b></td></tr>
    <tr class="kt"><td>Einheitspreis je ${esc(it.einheit)}${it.modus!=='k7'?' <span class="warnc">(noch nicht aktiv – Preisermittlung auf „nach K7“ stellen)</span>':''}</td><td class="n">${fmt(k.ep)}</td></tr></table></div>`;
}
function preisspiegel(lv){
  const R='lv|'+lv.id,oz=lvOZ(lv),gr=S().abwGrenze/100,pos=lv.items.filter(i=>i.typ==='POS');
  const bp=(p,b)=>{const x=p.preise?.[b.id];return x?{l:+x.l||0,s:+x.s||0,ep:r2((+x.l||0)+(+x.s||0))}:null};
  const summe=b=>{let s=0;for(const p of pos)if(!p.art){const x=bp(p,b);if(x)s+=x.ep*(+p.menge||0)}return r2(s*(1-(+b.nachlass||0)/100))};
  const sums=lv.bieter.map(b=>({b,s:summe(b)})).sort((a,c)=>a.s-c.s);
  const rang=Object.fromEntries(sums.map((x,i)=>[x.b.id,i+1]));
  const schaetz=lv.schaetzung||lv.art==='angebot';
  return`<div class="card"><h2>Bieter</h2><table class="k"><thead><tr><th>Bieter</th><th class="n">Nachlass %</th><th class="n">Angebotssumme netto</th><th class="n">Rang</th><th></th></tr></thead><tbody>
  ${lv.bieter.map((b,i)=>`<tr><td>${fi(R,`bieter.${i}.name`,b.name,{ph:'Name Bieter'})}</td><td>${fi(R,`bieter.${i}.nachlass`,b.nachlass,{n:1,w:'90px'})}</td><td class="n">${fmt(summe(b))}</td><td class="n">${rang[b.id]}</td><td><button class="s d" data-act="arrdel" data-r="${R}" data-f="bieter" data-i="${i}">✕</button></td></tr>`).join('')}
  </tbody></table><button class="s" data-act="arradd" data-r="${R}" data-f="bieter" data-tpl="bieter">+ Bieter</button>
  <p class="mut" style="font-size:12px;margin:8px 0 0">EP Lohn / Sonstiges je Bieter eintragen. Markiert: Abweichung vom Mittel der Bieter über ${fmtQ(S().abwGrenze)} % (spekulationsverdächtig) · grün = niedrigster EP. Grenze unter Einstellungen.</p></div>
  ${lv.bieter.length?`<div class="card" style="overflow-x:auto;padding:6px"><table class="k ps"><thead><tr><th>OZ</th><th>Kurztext</th><th class="n">Menge</th>${schaetz?'<th class="n">Schätzung EP</th>':''}${lv.bieter.map(b=>`<th colspan="3" class="n">${esc(b.name||'Bieter')}<br><span class="mut">Lohn · Sonst. · EP</span></th>`).join('')}</tr></thead><tbody>
  ${pos.map(p=>{const i=lv.items.indexOf(p),eps=lv.bieter.map(b=>bp(p,b)?.ep).filter(x=>x>0),mittel=eps.length?eps.reduce((a,x)=>a+x,0)/eps.length:0,min=eps.length?Math.min(...eps):0;
    return`<tr><td>${oz[p.id]}${p.art?' '+p.art:''}</td><td>${esc(p.kurz)}</td><td class="n">${fmtQ(p.menge)} ${esc(p.einheit)}</td>${schaetz?`<td class="n">${fmt(posPreis(lv,p).ep)}</td>`:''}
    ${lv.bieter.map(b=>{const x=bp(p,b),d=x&&mittel?(x.ep-mittel)/mittel:NaN,flag=isFinite(d)&&Math.abs(d)>gr&&eps.length>1;
      return`<td>${fi(R,`items.${i}.preise.${b.id}.l`,p.preise?.[b.id]?.l??'',{n:1,w:'78px'})}</td><td>${fi(R,`items.${i}.preise.${b.id}.s`,p.preise?.[b.id]?.s??'',{n:1,w:'78px'})}</td><td class="n ${flag?'err':x&&x.ep===min&&eps.length>1?'okc':''}" title="${isFinite(d)?'Abw. vom Mittel '+pct(d):''}">${x?fmt(x.ep):''}${flag?' ⚠':''}</td>`}).join('')}</tr>`}).join('')}

/* =====================================================================
   STANDARDISIERTE LEISTUNGSBESCHREIBUNG (LB-HT u. a.) – Import ONLB (ÖNORM A 2063)
   Kataloge liegen je Gerät im Browser-Speicher (IndexedDB), nicht in erp-daten.json.
   ===================================================================== */
let LBC={};            // geladene Kataloge (Schlüssel z. B. "HT14")
let LBLISTE=null;      // Übersicht der importierten Kataloge
function x2h(n){
  let o='';
  for(const c of n.childNodes){
    if(c.nodeType===3){o+=esc(c.nodeValue);continue}
    if(c.nodeType!==1)continue;
    const ln=c.localName;
    if(ln==='br'){o+='<br>';continue}
    const t={p:'div',b:'b',strong:'b',i:'i',em:'i',u:'u',ul:'ul',ol:'ol',li:'li',al:'al',sup:'sup',sub:'sub',table:'table',tr:'tr',td:'td',h2:'b',h3:'b'}[ln];
    const inner=x2h(c);o+=t?`<${t}>${inner}</${t}>`:inner;
  }
  return o.trim();
}
function lbParse(text){
  const x=new DOMParser().parseFromString(text,'application/xml');
  if(x.getElementsByTagName('parsererror').length)throw new Error('Die Datei ist kein gültiges XML.');
  const root=x.documentElement;
  if(root.localName!=='onlb')throw new Error('Keine ÖNORM-Leistungsbeschreibung (ONLB). Gefunden: <'+root.localName+'>');
  const kid=(n,name)=>{if(!n)return null;for(const c of n.children)if(c.localName===name)return c;return null};
  const kids=(n,name)=>n?[...n.children].filter(c=>c.localName===name):[];
  const txt=(n,name)=>kid(n,name)?.textContent.trim()||'';
  const h=n=>n?x2h(n):'';
  const kd=kid(root,'lbkenndaten');
  const cat={kennung:txt(kd,'lbkennung'),version:txt(kd,'versionsnummer'),datum:txt(kd,'versionsdatum'),bez:txt(kd,'bezeichnung'),svb:h(kid(kid(root,'svb'),'vorbemerkung')),lgs:[]};
  let n=0;
  for(const lg of kids(kid(root,'lg-liste'),'lg')){
    const e=kid(lg,'lg-eigenschaften'),L={nr:lg.getAttribute('nr'),t:txt(e,'ueberschrift'),vb:h(kid(e,'vorbemerkung')),ulgs:[]};
    for(const u of kids(kid(lg,'ulg-liste'),'ulg')){
      const ue=kid(u,'ulg-eigenschaften'),U={nr:u.getAttribute('nr'),t:txt(ue,'ueberschrift'),vb:h(kid(ue,'vorbemerkung')),gts:[]};
      for(const g of kids(kid(u,'positionen'),'grundtextnr')){
        const G={nr:g.getAttribute('nr'),gt:h(kid(kid(g,'grundtext'),'langtext')),fps:[]};
        for(const f of [...kids(g,'folgeposition'),...kids(g,'ungeteilteposition')]){
          const pe=kid(f,'pos-eigenschaften');
          G.fps.push({ft:f.getAttribute('ftnr')||'',stw:txt(pe,'stichwort'),lt:h(kid(pe,'langtext')),eh:txt(pe,'einheit')});n++;
        }
        U.gts.push(G);
      }
      L.ulgs.push(U);
    }

/* ---------- Export & Sicherung ---------- */
function csvDownload(name,head,rows){
  const c=v=>{if(typeof v==='number')return String(r2(v)).replace('.',',');const s=String(v??'');return/[;"\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};
  const txt='﻿'+[head,...rows].map(r=>r.map(c).join(';')).join('\r\n');
  dl(new Blob([txt],{type:'text/csv;charset=utf-8'}),name);
}
function dl(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}

  anew:()=>{const s=S(),nr=String(++s.anr).padStart(5,'0');const a={id:uid(),nr,bez:'',text:'',art:'W',einheit:'Stk',einheiten:[],ek:0,vk:0,steuer:s.stdSteuer,lager:false,minBestand:0,lieferanten:[],aktiv:true};DB.artikel.push(a);persist();go('artikel/'+a.id)},

    let menge=m==='ist'?r3(q-bestand(a).menge):q;if(!menge){alert('Keine Mengenänderung.');return}

Object.assign(ACT,ACT_LV,ACT_LB,ACT_FB);
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');
  if(!el){if(!e.target.closest('.pop'))closePop();return}
  if(el.tagName==='SELECT')return;
  ACT[el.dataset.act]?.(el,e);
});
document.addEventListener('change',e=>{
  const el=e.target,d=el.dataset;
  if(el.tagName==='SELECT'&&d.act){ACT[d.act]?.(el,e);return}
  if(el.id==='logo')return logoUpload(el);
  if(el.id==='imp')return importJSON(el);
  if(el.id==='lbimp')return lbImport(el);
  if(el.id==='att'){const b=curBeleg();if(b)anhaengeHochladen(b,[...el.files]);return}
  if(el.id==='erfoto'){const files=[...el.files];if(!files.length)return;const b=neuBeleg('ER',{kopf:'',fuss:''});go('beleg/'+b.id);anhaengeHochladen(b,files);return}
  const v=el.type==='checkbox'?el.checked:el.value,nv=el.type==='number'?num(v):v;
  if(d.p!==undefined){const b=curBeleg();if(!b||b.fest)return;onPos(b,+d.p,d.f,v);persist();return}
  if(d.h){const b=curBeleg();if(!b||b.fest)return;onHead(b,d.h,el.type==='number'?num(v):v);persist();return}
  switch(d.o){
    case'ui':UI[d.f]=v;render();return;
    case'lbsel':{const s=UI.lbSel||(UI.lbSel=[]),i=s.indexOf(d.k);if(el.checked&&i<0)s.push(d.k);if(!el.checked&&i>=0)s.splice(i,1);const z=document.querySelector('.lbsel b');if(z)z.textContent=s.length;const bt=document.querySelector('[data-act=lbins]');if(bt)bt.disabled=!(s.length&&UI.lbZiel);return}
    case'path':{const[c,id]=d.r.split('|'),o=ROOT[c](id);if(!o)return;if(c==='lv')lvBieterPreisInit(o,d.f);setP(o,d.f,d.t==='n'?num(v):el.type==='checkbox'?el.checked:v);persist();renderErhalten();return}
    case'k':{const k=kontakt(d.id);k[d.f]=nv;break}
    case'a':{const a=artikel(d.id);if(d.f==='einheitenStr'){a.einheiten=String(v).split(/[;,]/).map(x=>x.split('=')).filter(x=>x.length===2&&x[0].trim()&&num(x[1])>0).map(([e,f])=>({e:e.trim(),f:num(f)}));for(const x of a.einheiten)if(!S().einheiten.includes(x.e))S().einheiten.push(x.e)}else a[d.f]=nv;if(['nr','bez','aktiv'].includes(d.f))artDatalist();if(['lager','einheitenStr'].includes(d.f)){persist();render();return}break}
    case'al':artikel(d.id).lieferanten[+d.i][d.f]=v;break;
    case's':if(d.f==='einheitenStr')S().einheiten=String(v).split(',').map(x=>x.trim()).filter(Boolean);else{const pth=d.f.split('.');let o=S();while(pth.length>1)o=o[pth.shift()];o[pth[0]]=nv}break;
    case'st':{const x=S().steuer[+d.i];if(d.f==='code'){const alt=x.code;if(S().steuer.some((y,j)=>j!==+d.i&&y.code===v)){alert('Code existiert bereits.');render();return}if(DB.belege.some(b=>b.pos.some(p=>p.steuer===alt))){alert('Code wird verwendet und kann nicht geändert werden.');render();return}}x[d.f]=nv;break}
    case'tf':S().tarife[+d.i][d.f]=nv;break;
    case'fbk':FB().konten[+d.i][d.f]=v;break;
    case'fbmap':{if(d.f==='!sperre'){FB().sperre=v;log('Periodensperre',v)}else setP(FB().map,d.f,v);break}
    case'nk':{const j=String(new Date().getFullYear()),nk=S().nk[d.t];if(d.f==='prefix')nk.prefix=v.trim()||d.t;else{const used=DB.belege.filter(b=>b.typ===d.t&&b.nr&&b.nr.includes('-'+j+'-')).length;if(used&&num(v)<(nk.zaehler[j]||0)&&!confirm('Achtung: Zähler kleiner als bereits vergebene Nummern – Doppelvergabe möglich. Trotzdem setzen?')){render();return}nk.zaehler[j]=Math.max(0,Math.floor(num(v)))}log('Nummernkreis',`${d.t}: ${d.f}=${v}`);break}
    case'tx':S().texte[d.t][d.f]=v;break;
    default:return;
  }
  persist();
});
function onHead(b,f,v){
  b[f]=v;
  if(f==='optRabatt'||f==='optLS'){if(f==='optLS'&&v)for(const p of b.pos)if(!isInfo(p)&&p.epL==null&&p.epS==null){p.epL=p.art==='L'?+p.ep||0:0;p.epS=p.art==='L'?0:+p.ep||0}render();return}
  if(f==='kontaktId'){const k=kontakt(v);if(k&&k.zahlungsziel!==''&&k.zahlungsziel!=null&&T[b.typ].b==='V')b.zahlungsziel=+k.zahlungsziel;render()}
  if(f==='datum'&&b.typ==='AN'){b.gueltigBis=addDays(v,S().angebotGueltig);render()}
  updateCalc(b);
}
function onPos(b,i,f,v){
  const p=b.pos[i];
  if(f==='artikel'){
    const s=String(v).trim(),a=DB.artikel.find(a=>a.aktiv!==false&&(`${a.nr} – ${a.bez}`===s||a.nr===s));
    if(a){artikelInPos(b,p,a);renderFocus(`[data-p="${i}"][data-f="menge"]`)}else{p.artikelId='';p.nr=s}
    return;
  }
  if(f==='einheit'){
    const a=artikel(p.artikelId),alt=a?.einheiten?.find(x=>x.e===v),nf=alt?+alt.f:1;
    if(a){const r=nf/(+p.faktor||1);p.ep=r2(p.ep*r);p.ek=r2(p.ek*r)}
    p.einheit=v;p.faktor=nf;render();return;
  }
  p[f]=['menge','ep','rabatt','ek','pauschal','epL','epS'].includes(f)?num(v):v;
  if(f==='epL'||f==='epS'){p.ep=r2((+p.epL||0)+(+p.epS||0));const e=document.querySelector(`[data-p="${i}"][data-f="ep"]`);if(e)e.value=p.ep}
  if(['art','pauschal','ohneEP','kz'].includes(f)&&(f!=='kz'||p.art==='G'))render();else updateCalc(b);
}
/* Formatierungsleiste für Texte (fett, kursiv, unterstrichen, Listen) */
(function(){
  const bar=document.createElement('div');bar.id='rtebar';
  bar.innerHTML=[['bold','<b>F</b>','Fett (Strg+B)'],['italic','<i>K</i>','Kursiv (Strg+I)'],['underline','<u>U</u>','Unterstrichen (Strg+U)'],['insertUnorderedList','•','Aufzählung'],['insertOrderedList','1.','Nummerierung'],['removeFormat','⌫','Formatierung entfernen']]
    .map(([c,l,t])=>`<button type="button" data-cmd="${c}" title="${t}">${l}</button>`).join('');
  document.body.appendChild(bar);
  bar.addEventListener('mousedown',e=>{e.preventDefault();const c=e.target.closest('[data-cmd]')?.dataset.cmd;if(c)document.execCommand(c,false,null)});
  document.addEventListener('focusin',e=>{
    const el=e.target.closest?.('.rte[contenteditable],.ed.ml');
    if(!el){bar.style.display='none';return}
    const r=el.getBoundingClientRect();bar.style.display='flex';
    bar.style.top=Math.max(4,r.top+scrollY-34)+'px';bar.style.left=Math.max(4,r.left+scrollX)+'px';
  });
  document.addEventListener('focusout',e=>{setTimeout(()=>{if(!document.activeElement?.closest?.('.rte,.ed.ml'))bar.style.display='none'},0)});
})();
function logoUpload(el){
  const file=el.files[0];if(!file)return;
  if(file.size>300*1024){alert('Logo zu groß (max. 300 kB).');return}
  const r=new FileReader();r.onload=()=>{S().firma.logo=r.result;persist();render()};r.readAsDataURL(file);
}
function importJSON(el){
  const file=el.files[0];if(!file)return;
  const r=new FileReader();r.onload=()=>{
    try{const d=JSON.parse(r.result);if(!d.settings||!Array.isArray(d.belege))throw new Error('Keine ERP-Lite-Datei.');
      if(!confirm(`Import ersetzt ALLE aktuellen Daten (${DB.belege.length} Belege) durch die Datei (${d.belege.length} Belege). Fortfahren?`))return;
      DB=migrate(d);log('Import',file.name);artDatalist();commit();go('dash')}
    catch(e){alert('Import fehlgeschlagen: '+e.message)}
  };r.readAsText(file);
}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closePop();if((e.ctrlKey||e.metaKey)&&e.key==='s'){e.preventDefault();commit()}});

document.addEventListener('click',e=>{if(document.body.classList.contains('nav')&&!e.target.closest('nav'))document.body.classList.remove('nav')});

start();
